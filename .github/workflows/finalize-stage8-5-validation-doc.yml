name: Finalize Stage 8.5 validation doc

on:
  push:
    branches:
      - agent/stage8-5-graphics-validation
    paths:
      - .github/workflows/finalize-stage8-5-validation-doc.yml

permissions:
  contents: write

jobs:
  finalize-validation-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v5
        with:
          ref: agent/stage8-5-graphics-validation
          fetch-depth: 0

      - name: Synchronize final technology decision
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/stage8_5_graphics_validation.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "The final decision is intentionally deferred until the remaining visual review is complete:\n\n- `KEEP_LIBGDX`, or\n- `MIGRATION_RECOMMENDED` with measured evidence and migration cost.",
                  "The Stage-8.5 decision is complete: **`KEEP_LIBGDX`**. The authoritative final rationale and post-integration evidence are recorded in `docs/stage8_5_technology_decision.md`."
              ),
              (
                  "These results strongly exceed the Stage-8.5 60 FPS target for the representative scene. Hardware model/driver details are still required before this becomes a complete reference-machine record.",
                  "These results strongly exceeded the Stage-8.5 60 FPS target for the representative scene and motivated the orientation correction. A later post-integration Representative run with the approved authored engine/emissive pipeline also passed on the reference Windows machine."
              ),
              (
                  "## Remaining visual review\n\nUse Tactical and Close-up modes to inspect:\n\n- runtime nose direction relative to procedural ships;\n- tactical-size silhouette readability;\n- wider-zoom readability;\n- whether the sprite becomes visually noisy when downscaled;\n- three transformed main-engine glow origins;\n- exhaust direction under rotation;\n- transformed nose-weapon beam origin;\n- all five weapon hardpoints;\n- pivot/rotation stability;\n- transparent-edge behavior;\n- footprint plausibility relative to visible hull;\n- emissive alignment if an optional mask is later added.",
                  "## Completed real-GPU visual review\n\nTactical, Close-up and dedicated asset-pack inspection confirmed:\n\n- runtime-right nose direction relative to procedural ships;\n- tactical-size silhouette readability;\n- three transformed main-engine origins;\n- exhaust direction and attachment under rotation;\n- transformed nose-weapon beam origin;\n- pivot/rotation stability;\n- transparent-edge behavior;\n- emissive alignment;\n- damage-layer alignment;\n- authored engine `OFF / IDLE / THRUST` states.\n\nThe remaining four weapon hardpoints are intentionally provisional attachment seams until production weapon/turret art exists; this does not block the rendering-stack decision."
              ),
              (
                  "The roadmap target remains 60 FPS at 1920x1080 on the documented reference developer machine. The real-GPU run already exceeds that performance target by a very large margin for the current representative scene, but the final technology decision also considers visual correctness, batching behavior, maintainability and the final asset workflow.",
                  "The roadmap target remains 60 FPS at 1920x1080 on the documented reference developer machine. The final post-integration Representative run at 2560x1369 reached approximately 2376 FPS, 0.43 ms average frame time, 0.60 ms p95, 1.68 ms max and 35 draw calls with 50 ships, 500 asteroids, 2000 particles, authored heavy-corvette thrust/emissive and post-processing enabled. Together with architecture and visual evidence, this supports `KEEP_LIBGDX`."
              ),
              (
                  "## Still required before Stage 8.5 closes\n\n- run the new Tactical and Close-up modes on the real heavy corvette;\n- verify/correct transformed engine and weapon hardpoints from close screenshots;\n- repeat Representative once after orientation normalization to ensure no regression;\n- record CPU/GPU/RAM/driver details for the reference machine;\n- decide whether to create an emissive mask and/or dedicated bloom pass;\n- write the final `KEEP_LIBGDX` or `MIGRATION_RECOMMENDED` decision with evidence;\n- update `docs/development_roadmap.md` with exact final verification and activate Stage 9 only after the gate passes.",
                  "## Stage 8.5 close status\n\n**COMPLETE — `KEEP_LIBGDX`.**\n\n- final decision record exists;\n- roadmap marks Stage 8.5 complete and Stage 9A active;\n- real-GPU hardware profile is documented in the final decision record;\n- authored engine/emissive integration is present in the Representative spike;\n- dedicated production bloom is deferred as a configurable future quality feature, not a technology blocker;\n- `BloomMode = OFF / LIGHT / FULL` is scheduled for Stage 13 / V4 and final graphics settings in Stage 22."
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit("Expected validation-doc block not found:\n" + old[:180])
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit document and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "star-empires-roadmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/finalize-stage8-5-validation-doc.yml
          git add docs/stage8_5_graphics_validation.md
          git commit -m "docs: finalize Stage 8.5 validation record"
          git push origin HEAD:agent/stage8-5-graphics-validation
