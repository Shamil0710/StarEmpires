name: Stage17C2 Diagnostic

on:
  push:
    branches:
      - agent/stage17c-live-treasury-capitalization

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[stage17c2-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17c-live-treasury-capitalization
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Capture verify failure summary
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress clean verify > /tmp/stage17c2.log 2>&1
          status=$?
          echo "verify_exit_code=$status" > stage17c2-diagnostic.log
          echo "--- FAILURES ---" >> stage17c2-diagnostic.log
          grep -n -E '^\[ERROR\]|<<< FAILURE|Failures: [1-9]|Errors: [1-9]|COMPILATION ERROR|BUILD FAILURE|Javadoc|jacoco' /tmp/stage17c2.log | tail -n 320 >> stage17c2-diagnostic.log || true
          echo "--- TAIL ---" >> stage17c2-diagnostic.log
          tail -n 220 /tmp/stage17c2.log >> stage17c2-diagnostic.log
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage17c2-diagnostic.log
          git commit -m "[stage17c2-diagnostic] capture verify failure"
          git push origin HEAD:agent/stage17c-live-treasury-capitalization
