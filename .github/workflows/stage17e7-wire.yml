name: Stage 17E.7 world wiring

on:
  push:
    branches:
      - agent/stage17e-economic-dependence-diagnostics
    paths:
      - .github/workflows/stage17e7-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17e-economic-dependence-diagnostics
      - name: Add read-only world diagnostics boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/spacesim/world/WorldSimulation.java')
          text = path.read_text(encoding='utf-8')
          anchor = '    /**\n     * Evaluates explainable effective legal market access at the authoritative world tick.\n'
          method = '''    /**
           * Computes current read-only structural economic dependence of one faction on another.
           *
           * <p>The result is derived from physical inventories, market targets/quotes, active production,
           * legal access and topology at the authoritative world tick. It does not mutate world state and
           * does not pretend that current structural exposure is historical import/export share.</p>
           *
           * @param sourceFactionContentId faction whose exposure is measured
           * @param partnerFactionContentId supplier/market partner being tested
           * @return immutable authoritative diagnostics snapshot
           */
          public FactionEconomicDependenceDiagnostics analyzeEconomicDependence(
                  String sourceFactionContentId,
                  String partnerFactionContentId) {
              return FactionEconomicDependenceAnalyzer.analyze(
                      this, contentCatalog, sourceFactionContentId, partnerFactionContentId);
          }

          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'WorldSimulation diagnostics anchor count={text.count(anchor)}')
          path.write_text(text.replace(anchor, method + anchor, 1), encoding='utf-8')
          PY
      - name: Remove applicator and commit
        run: |
          rm .github/workflows/stage17e7-wire.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add src/main/java/com/spacesim/world/WorldSimulation.java .github/workflows/stage17e7-wire.yml
          git commit -m "Stage 17E.7: expose economic-dependence diagnostics"
          git push
