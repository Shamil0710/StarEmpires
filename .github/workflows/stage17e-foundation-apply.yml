name: Stage 17E foundation integrator

on:
  push:
    branches:
      - agent/stage17e-diplomacy-foundation

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage17e-diplomacy-foundation
          fetch-depth: 0

      - name: Integrate diplomacy aggregate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected once, found {count}')
              return text.replace(old, new, 1)

          # WorldState: append explicit diplomacy aggregate while preserving every old constructor.
          path = Path('src/main/java/com/spacesim/world/WorldState.java')
          text = path.read_text()
          text = replace_once(
              text,
              '        List<FleetJumpState> fleetJumps,\n        List<WorldFactionIdentityState> factionIdentities) {',
              '        List<FleetJumpState> fleetJumps,\n        List<WorldFactionIdentityState> factionIdentities,\n        List<FactionDiplomacyState> factionDiplomacyStates) {',
              'WorldState record tail')
          marker = '    /** Текущая Stage-17 версия world-level persistent schema. */\n'
          compatibility = '''    /**
     * Source-compatible pre-Stage-17E constructor with neutral explicit diplomacy.
     *
     * @param schemaVersion world schema version
     * @param topology galaxy topology
     * @param systems local simulation snapshots
     * @param factions faction economic states
     * @param factionStrategies faction strategic states
     * @param nextConstructionProjectIdValue construction allocator watermark
     * @param constructionProjects persistent construction projects
     * @param factionEconomicPressures persistent economic-pressure states
     * @param nextFleetIdValue fleet allocator watermark
     * @param fleets fleet placements
     * @param fleetJumps active jump states
     * @param factionIdentities world-defined faction identities
     */
    public WorldState(
            int schemaVersion,
            GalaxyTopology topology,
            List<StarSystemSimulationState> systems,
            List<FactionEconomicState> factions,
            List<FactionStrategicState> factionStrategies,
            long nextConstructionProjectIdValue,
            List<ConstructionProjectState> constructionProjects,
            List<FactionEconomicPressureState> factionEconomicPressures,
            long nextFleetIdValue,
            List<FleetPlacementState> fleets,
            List<FleetJumpState> fleetJumps,
            List<WorldFactionIdentityState> factionIdentities) {
        this(
                schemaVersion,
                topology,
                systems,
                factions,
                factionStrategies,
                nextConstructionProjectIdValue,
                constructionProjects,
                factionEconomicPressures,
                nextFleetIdValue,
                fleets,
                fleetJumps,
                factionIdentities,
                neutralDiplomacy(factionStrategies));
    }

'''
          text = replace_once(text, marker, compatibility + marker, 'WorldState compatibility constructor')
          text = replace_once(
              text,
              '        Objects.requireNonNull(factionIdentities, "World faction identities WorldState не заданы");\n',
              '        Objects.requireNonNull(factionIdentities, "World faction identities WorldState не заданы");\n'
              '        Objects.requireNonNull(factionDiplomacyStates, "Faction diplomacy states WorldState not set");\n',
              'WorldState diplomacy null check')
          strategy_anchor = '        factionStrategies = List.copyOf(sortedStrategies);\n\n'
          diplomacy_validation = '''        factionStrategies = List.copyOf(sortedStrategies);

        List<FactionDiplomacyState> sortedDiplomacy = new ArrayList<>(factionDiplomacyStates.size());
        Set<String> diplomacyFactionIds = new HashSet<>();
        Set<String> treatyIds = new HashSet<>();
        for (FactionDiplomacyState diplomacy : factionDiplomacyStates) {
            FactionDiplomacyState value = Objects.requireNonNull(diplomacy, "FactionDiplomacyState not set");
            if (!strategicFactionIds.contains(value.factionContentId())) {
                throw new IllegalArgumentException("Diplomacy state references unknown strategic faction: "
                        + value.factionContentId());
            }
            if (!diplomacyFactionIds.add(value.factionContentId())) {
                throw new IllegalArgumentException("Duplicate faction diplomacy state: " + value.factionContentId());
            }
            for (DiplomaticStandingState standing : value.standings()) {
                requireDiplomaticTarget(strategicFactionIds, standing.targetFactionContentId());
            }
            for (DiplomaticGrievanceState grievance : value.grievances()) {
                requireDiplomaticTarget(strategicFactionIds, grievance.targetFactionContentId());
            }
            for (DiplomaticTreatyState treaty : value.treaties()) {
                requireDiplomaticTarget(strategicFactionIds, treaty.counterpartyFactionContentId());
                if (!treatyIds.add(treaty.treatyId())) {
                    throw new IllegalArgumentException("Duplicate world treaty ID: " + treaty.treatyId());
                }
                for (DiplomaticTreatyClauseState clause : treaty.clauses()) {
                    if (clause.systemId() != null && topology.findSystem(clause.systemId()).isEmpty()) {
                        throw new IllegalArgumentException("Treaty clause references unknown StarSystem: "
                                + clause.systemId());
                    }
                }
            }
            for (DiplomaticEmbargoState embargo : value.embargoes()) {
                requireDiplomaticTarget(strategicFactionIds, embargo.targetFactionContentId());
            }
            sortedDiplomacy.add(value);
        }
        if (!diplomacyFactionIds.equals(strategicFactionIds)) {
            throw new IllegalArgumentException("Faction diplomacy states must exactly cover strategic factions");
        }
        sortedDiplomacy.sort(Comparator.naturalOrder());
        factionDiplomacyStates = List.copyOf(sortedDiplomacy);

'''
          text = replace_once(text, strategy_anchor, diplomacy_validation, 'WorldState diplomacy validation')
          helper = '''
    private static List<FactionDiplomacyState> neutralDiplomacy(List<FactionStrategicState> strategies) {
        Objects.requireNonNull(strategies, "Faction strategic states not set");
        List<FactionDiplomacyState> result = new ArrayList<>(strategies.size());
        for (FactionStrategicState strategy : strategies) {
            result.add(FactionDiplomacyState.neutral(
                    Objects.requireNonNull(strategy, "FactionStrategicState not set").factionContentId()));
        }
        result.sort(Comparator.naturalOrder());
        return List.copyOf(result);
    }

    private static void requireDiplomaticTarget(Set<String> knownFactionIds, String targetFactionContentId) {
        if (!knownFactionIds.contains(targetFactionContentId)) {
            throw new IllegalArgumentException("Diplomacy state references unknown target faction: "
                    + targetFactionContentId);
        }
    }
'''
          index = text.rfind('\n}')
          if index < 0:
              raise SystemExit('WorldState final brace not found')
          text = text[:index] + helper + text[index:]
          path.write_text(text)

          # WorldStateCodec: file-format v4 adds diplomacy trailer; v1-v3 migrate to neutral state.
          path = Path('src/main/java/com/spacesim/persistence/WorldStateCodec.java')
          text = path.read_text()
          text = replace_once(
              text,
              'import com.spacesim.world.FactionEconomicState;\n',
              'import com.spacesim.world.FactionEconomicState;\nimport com.spacesim.world.FactionDiplomacyState;\n',
              'WorldStateCodec diplomacy import')
          text = replace_once(
              text,
              '    private static final int GROWTH_FILE_FORMAT_VERSION = 2;\n    private static final int FILE_FORMAT_VERSION = 3;\n',
              '    private static final int GROWTH_FILE_FORMAT_VERSION = 2;\n'
              '    private static final int TERRITORY_FILE_FORMAT_VERSION = 3;\n'
              '    private static final int FILE_FORMAT_VERSION = 4;\n',
              'WorldStateCodec format constants')
          text = replace_once(
              text,
              '                WorldTerritoryBinary.write(output, checked.factionStrategies());\n',
              '                WorldTerritoryBinary.write(output, checked.factionStrategies());\n'
              '                WorldDiplomacyBinary.write(output, checked.factionDiplomacyStates());\n',
              'WorldStateCodec diplomacy write')
          text = replace_once(
              text,
              '            if (fileVersion != FILE_FORMAT_VERSION\n                    && fileVersion != GROWTH_FILE_FORMAT_VERSION\n                    && fileVersion != LEGACY_FILE_FORMAT_VERSION) {',
              '            if (fileVersion != FILE_FORMAT_VERSION\n'
              '                    && fileVersion != TERRITORY_FILE_FORMAT_VERSION\n'
              '                    && fileVersion != GROWTH_FILE_FORMAT_VERSION\n'
              '                    && fileVersion != LEGACY_FILE_FORMAT_VERSION) {',
              'WorldStateCodec version acceptance')
          text = replace_once(
              text,
              '            if (fileVersion >= FILE_FORMAT_VERSION) {\n                List<FactionStrategicState> strategies =\n                        WorldTerritoryBinary.readAndAttach(input, state.factionStrategies());\n                state = withStrategies(state, strategies);\n            }\n\n            if (input.read() != -1) {',
              '            if (fileVersion >= TERRITORY_FILE_FORMAT_VERSION) {\n'
              '                List<FactionStrategicState> strategies =\n'
              '                        WorldTerritoryBinary.readAndAttach(input, state.factionStrategies());\n'
              '                state = withStrategies(state, strategies);\n'
              '            }\n'
              '            if (fileVersion >= FILE_FORMAT_VERSION) {\n'
              '                state = withDiplomacy(state, WorldDiplomacyBinary.read(input));\n'
              '            }\n\n'
              '            if (input.read() != -1) {',
              'WorldStateCodec decode trailers')
          text = replace_once(
              text,
              '                state.fleetJumps(),\n                state.factionIdentities());\n    }\n}',
              '                state.fleetJumps(),\n'
              '                state.factionIdentities(),\n'
              '                state.factionDiplomacyStates());\n'
              '    }\n\n'
              '    private static WorldState withDiplomacy(\n'
              '            WorldState state,\n'
              '            List<FactionDiplomacyState> diplomacyStates) {\n'
              '        return new WorldState(\n'
              '                state.schemaVersion(),\n'
              '                state.topology(),\n'
              '                state.systems(),\n'
              '                state.factions(),\n'
              '                state.factionStrategies(),\n'
              '                state.nextConstructionProjectIdValue(),\n'
              '                state.constructionProjects(),\n'
              '                state.factionEconomicPressures(),\n'
              '                state.nextFleetIdValue(),\n'
              '                state.fleets(),\n'
              '                state.fleetJumps(),\n'
              '                state.factionIdentities(),\n'
              '                diplomacyStates);\n'
              '    }\n'
              '}',
              'WorldStateCodec preserve diplomacy helper')
          path.write_text(text)

          # WorldSimulation: own diplomacy runtime and materialize access on authoritative tick.
          path = Path('src/main/java/com/spacesim/world/WorldSimulation.java')
          text = path.read_text()
          text = replace_once(
              text,
              '    private final TerritorialControlRuntime territorialControlRuntime;\n    private final DestructionService destructionService;\n',
              '    private final TerritorialControlRuntime territorialControlRuntime;\n'
              '    private final FactionDiplomacyRuntime diplomacyRuntime;\n'
              '    private final DestructionService destructionService;\n',
              'WorldSimulation diplomacy field')
          text = replace_once(
              text,
              '            Map<String, FactionEconomicAccount> factionAccountsById,\n            List<FactionStrategicState> factionStrategies,\n            long nextConstructionProjectIdValue,',
              '            Map<String, FactionEconomicAccount> factionAccountsById,\n'
              '            List<FactionStrategicState> factionStrategies,\n'
              '            List<FactionDiplomacyState> factionDiplomacyStates,\n'
              '            long nextConstructionProjectIdValue,',
              'WorldSimulation constructor diplomacy param')
          text = replace_once(
              text,
              '        this.territorialControlRuntime = new TerritorialControlRuntime(\n                topology,\n                this.sessionsById,\n                this.factionIdentityResolver,\n                this.constructionProjectService,\n                factionStrategies);\n        this.destructionService = new DestructionService(',
              '        this.territorialControlRuntime = new TerritorialControlRuntime(\n'
              '                topology,\n'
              '                this.sessionsById,\n'
              '                this.factionIdentityResolver,\n'
              '                this.constructionProjectService,\n'
              '                factionStrategies);\n'
              '        this.diplomacyRuntime = new FactionDiplomacyRuntime(\n'
              '                this.factionIdentityResolver, factionDiplomacyStates);\n'
              '        this.destructionService = new DestructionService(',
              'WorldSimulation diplomacy runtime init')
          text = replace_once(
              text,
              '        this.activeSystemId = activeSystemId;\n        this.strategicStepTicks = strategicStepTicks;\n        this.remoteUpdateBudgetPerFrame = remoteUpdateBudgetPerFrame;\n    }',
              '        this.activeSystemId = activeSystemId;\n'
              '        this.strategicStepTicks = strategicStepTicks;\n'
              '        this.remoteUpdateBudgetPerFrame = remoteUpdateBudgetPerFrame;\n'
              '        refreshFactionMarketAccess();\n'
              '    }',
              'WorldSimulation initial diplomacy refresh')
          text = replace_once(
              text,
              '                factionAccounts,\n                checked.factionStrategies(),\n                checked.nextConstructionProjectIdValue(),',
              '                factionAccounts,\n'
              '                checked.factionStrategies(),\n'
              '                checked.factionDiplomacyStates(),\n'
              '                checked.nextConstructionProjectIdValue(),',
              'WorldSimulation restore diplomacy argument')
          text = replace_once(
              text,
              '        constructionProjectService.advance();\n        territorialControlRuntime.advance(activeTick);\n        return new AdvanceReport(localTicks, strategicUpdates, maximumRemoteLagTicks(activeTick));',
              '        constructionProjectService.advance();\n'
              '        territorialControlRuntime.advance(activeTick);\n'
              '        if (diplomacyRuntime.marketAccessExpiryCrossed(activeTick)) {\n'
              '            refreshFactionMarketAccess();\n'
              '        }\n'
              '        return new AdvanceReport(localTicks, strategicUpdates, maximumRemoteLagTicks(activeTick));',
              'WorldSimulation diplomacy expiry refresh')
          identity_marker = '''    /** @return canonical immutable world-defined faction identities */
    public List<WorldFactionIdentityState> getWorldFactionIdentities() {
        return factionIdentityResolver.dynamicIdentities();
    }

'''
          identity_replacement = identity_marker + '''    /** @return canonical immutable Stage-17E faction diplomacy aggregates */
    public List<FactionDiplomacyState> getFactionDiplomacyStates() {
        return diplomacyRuntime.snapshots();
    }

    /**
     * Finds persistent institutional diplomacy for one authored or world-defined faction.
     *
     * @param factionContentId stable faction ID
     * @return diplomacy aggregate or empty
     */
    public Optional<FactionDiplomacyState> findFactionDiplomacyState(String factionContentId) {
        return Optional.ofNullable(diplomacyRuntime.find(factionContentId));
    }

    /**
     * Evaluates explainable effective legal market access at the authoritative world tick.
     *
     * @param marketOwnerFactionContentId faction owning the market
     * @param participantFactionContentId participant faction, or null for unfactioned
     * @return precedence decision: embargo, treaty right, or relation threshold
     */
    public DiplomaticMarketAccessResolver.Decision evaluateFactionMarketAccess(
            String marketOwnerFactionContentId,
            String participantFactionContentId) {
        return DiplomaticMarketAccessResolver.evaluate(
                territorialControlRuntime.snapshots(),
                diplomacyRuntime.snapshots(),
                marketOwnerFactionContentId,
                participantFactionContentId,
                getAuthoritativeWorldTick());
    }

'''
          text = replace_once(text, identity_marker, identity_replacement, 'WorldSimulation diplomacy read API')
          text = replace_once(
              text,
              '                fleetJumpService.snapshots(),\n                factionIdentityResolver.dynamicIdentities());',
              '                fleetJumpService.snapshots(),\n'
              '                factionIdentityResolver.dynamicIdentities(),\n'
              '                diplomacyRuntime.snapshots());',
              'WorldSimulation snapshot diplomacy')
          text = replace_once(
              text,
              '                new WorldTradeRouteCostModel(contentCatalog, territorialControlRuntime.snapshots()));',
              '                new WorldTradeRouteCostModel(\n'
              '                        factionIdentityResolver, territorialControlRuntime.snapshots()));',
              'WorldSimulation unified route identity')
          helper = '''
    private void refreshFactionMarketAccess() {
        long worldTick = getAuthoritativeWorldTick();
        for (SimulationSession session : sessionsById.values()) {
            FactionPolicyRuntime.install(
                    session,
                    factionIdentityResolver,
                    territorialControlRuntime.snapshots(),
                    diplomacyRuntime.snapshots(),
                    worldTick);
        }
        diplomacyRuntime.noteMarketAccessPolicyRefreshed(worldTick);
    }
'''
          index = text.rfind('\n}')
          if index < 0:
              raise SystemExit('WorldSimulation final brace not found')
          text = text[:index] + helper + text[index:]
          path.write_text(text)

          # Roadmap: mark Stage 17E active with the accepted foundation scope.
          path = Path('docs/development_roadmap.md')
          text = path.read_text()
          heading = '## 17E — diplomacy / market access / tariffs\n\n'
          status = ('## 17E — diplomacy / market access / tariffs\n\n'
                    '**ACTIVE.** 17E.1 persistent institutional diplomacy и 17E.3 market-access precedence реализуются первым production slice: explicit trust/credibility, grievances, treaty directory, embargo state и единый `embargo → treaty right → relation threshold` resolver поверх authored + world-defined faction identities.\n\n')
          text = replace_once(text, heading, status, 'Roadmap Stage17E ACTIVE status')
          path.write_text(text)
          PY

      - name: Self-remove integrator and commit
        shell: bash
        run: |
          rm .github/workflows/stage17e-foundation-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/spacesim/world/WorldState.java \
                  src/main/java/com/spacesim/world/WorldSimulation.java \
                  src/main/java/com/spacesim/persistence/WorldStateCodec.java \
                  docs/development_roadmap.md \
                  .github/workflows/stage17e-foundation-apply.yml
          git diff --cached --check
          git commit -m "Stage 17E: integrate persistent diplomacy foundation"
          git push origin HEAD:agent/stage17e-diplomacy-foundation
