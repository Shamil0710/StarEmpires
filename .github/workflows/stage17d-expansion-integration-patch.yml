name: Stage17D Expansion Integration Patch

on:
  push:
    branches:
      - agent/stage17d-territorial-process

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage17d-territorial-process
          fetch-depth: 0
      - name: Patch strategic growth copies and physical expansion completion
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main/java/com/spacesim/world/StrategicGrowthPlanService.java')
          text = path.read_text()
          old = '''        return new FactionStrategicState(
                      state.factionContentId(),
                      state.minimumMarketAccessRelation(),
                      state.relations(),
                      state.controlledSystems(),
                      state.stationTaxBasisPoints(),
                      state.foreignTerritoryTariffBasisPoints(),
                      state.stockPolicies(),
                      state.productionPolicies(),
                      goals);'''
          new = '''        return new FactionStrategicState(
                      state.factionContentId(),
                      state.minimumMarketAccessRelation(),
                      state.relations(),
                      state.controlledSystems(),
                      state.stationTaxBasisPoints(),
                      state.foreignTerritoryTariffBasisPoints(),
                      state.stockPolicies(),
                      state.productionPolicies(),
                      goals,
                      state.territorialClaims(),
                      state.territorialControlStates(),
                      state.territorialRecognitions(),
                      state.constructionRightsGranted());'''
          if text.count(old) != 1:
              raise SystemExit(f'growth copy anchor mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/main/java/com/spacesim/world/FactionExpansionRuntime.java')
          text = path.read_text()
          old = '''        if (project.status() == ConstructionProjectStatus.COMPLETED) {
                  FactionStrategicState claimed = addControlledSystem(strategy, plan.targetSystemId());
                  StrategicGrowthState.Plan established = StrategicGrowthPlanService.transition(
                          plan,
                          StrategicGrowthState.Status.ESTABLISHED,
                          plan.anchorProjectId(),
                          authoritativeTick());
                  claimed = StrategicGrowthPlanService.replacePlan(claimed, established);
                  releaseAssignedFleet(established);
                  replaceStrategy(claimed);
                  return established;
              }'''
          new = '''        if (project.status() == ConstructionProjectStatus.COMPLETED) {
                  FactionStrategicState current = world.findFactionStrategicState(
                          strategy.factionContentId()).orElseThrow();
                  if (current.claimFor(plan.targetSystemId()) == null) {
                      world.declareTerritorialClaim(
                              strategy.factionContentId(), plan.targetSystemId());
                      current = world.findFactionStrategicState(strategy.factionContentId()).orElseThrow();
                  }
                  if (!strategy.factionContentId().equals(
                          world.controllingFaction(plan.targetSystemId()).orElse(null))) {
                      return plan;
                  }
                  StrategicGrowthState.Plan established = StrategicGrowthPlanService.transition(
                          plan,
                          StrategicGrowthState.Status.ESTABLISHED,
                          plan.anchorProjectId(),
                          authoritativeTick());
                  current = StrategicGrowthPlanService.replacePlan(current, established);
                  releaseAssignedFleet(established);
                  replaceStrategy(current);
                  return established;
              }'''
          if text.count(old) != 1:
              raise SystemExit(f'expansion completion anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          start = text.find('    private FactionStrategicState addControlledSystem(')
          if start < 0:
              raise SystemExit('addControlledSystem start missing')
          end = text.find('\n    private void replacePlan(', start)
          if end < 0:
              raise SystemExit('addControlledSystem end missing')
          text = text[:start] + text[end:]

          old = '''        this.world = WorldSimulation.restore(
                      new WorldState(
                              state.schemaVersion(),
                              state.topology(),
                              state.systems(),
                              state.factions(),
                              strategies,
                              state.nextConstructionProjectIdValue(),
                              state.constructionProjects(),
                              state.factionEconomicPressures(),
                              state.nextFleetIdValue(),
                              state.fleets(),
                              state.fleetJumps()),'''
          new = '''        this.world = WorldSimulation.restore(
                      new WorldState(
                              state.schemaVersion(),
                              state.topology(),
                              state.systems(),
                              state.factions(),
                              strategies,
                              state.nextConstructionProjectIdValue(),
                              state.constructionProjects(),
                              state.factionEconomicPressures(),
                              state.nextFleetIdValue(),
                              state.fleets(),
                              state.fleetJumps(),
                              state.factionIdentities()),'''
          if text.count(old) != 1:
              raise SystemExit(f'expansion restore anchor mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage17d-expansion-integration-patch.yml
          git add src/main/java/com/spacesim/world/StrategicGrowthPlanService.java \
                  src/main/java/com/spacesim/world/FactionExpansionRuntime.java
          git commit -m "Route physical expansion through territorial claims"
          git push origin HEAD:agent/stage17d-territorial-process
