name: Stage 10B status update

on:
  push:
    branches:
      - agent/stage10b-jump-transit
    paths:
      - .github/workflows/stage10b-status-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/stage10b_status_update.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development_roadmap.md
          git rm scripts/stage10b_status_update.py
          git rm .github/workflows/stage10b-status-update.yml
          git commit -m "docs: link Stage 10B PR"
          git push origin HEAD:${GITHUB_REF_NAME}
