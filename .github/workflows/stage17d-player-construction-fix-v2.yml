name: Stage17D Player Construction Fix V2

on:
  push:
    branches:
      - agent/stage17d-territorial-process

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage17d-territorial-process
          fetch-depth: 0
      - name: Restore adapter and patch legal identity
        shell: python
        run: |
          import re, subprocess
          from pathlib import Path
          path = Path('src/main/java/com/spacesim/player/PlayerConstructionService.java')
          text = subprocess.check_output(
              ['git', 'show', 'origin/main:src/main/java/com/spacesim/player/PlayerConstructionService.java'],
              text=True)
          pattern = re.compile(
              r'ConstructionProjectId projectId = runtime\.world\(\)\.createConstructionProject\(\s*'
              r'null,\s*archetypeId,\s*placement\.systemId\(\),\s*x,\s*y\);')
          replacement = '''ConstructionProjectId projectId = runtime.world().createConstructionProject(
                  null,
                  current.factionContentId(),
                  archetypeId,
                  placement.systemId(),
                  x,
                  y);'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'createProject regex mismatch: {count}')
          pattern = re.compile(
              r'(ConstructionProjectState state = runtime\.world\(\)\.findConstructionProject\(projectId\)\.orElseThrow\(\);\s*'
              r'requireExternalContract\(state\);)')
          addition = '''\\1
                  if (!Objects.equals(current.factionContentId(), state.legalFactionContentId())) {
                      throw new IllegalStateException(
                              "Player construction legal faction differs from current affiliation");
                  }'''
          text, count = pattern.subn(addition, text, count=1)
          if count != 1:
              raise SystemExit(f'contract regex mismatch: {count}')
          path.write_text(text)
      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage17d-player-construction-fix-v2.yml
          git add src/main/java/com/spacesim/player/PlayerConstructionService.java
          git commit -m "Use faction legal identity for player construction"
          git push origin HEAD:agent/stage17d-territorial-process
