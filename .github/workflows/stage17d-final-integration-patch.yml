name: Stage17D Final Integration Patch

on:
  push:
    branches:
      - agent/stage17d-territorial-process

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage17d-territorial-process
          fetch-depth: 0
      - name: Apply cross-system Stage 17D integration
        shell: python
        run: |
          import re
          from pathlib import Path

          def replace_exact(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1, got {count}')
              path.write_text(text.replace(old, new, 1))

          # Preserve territorial state through Stage-11 pure growth-plan transformations.
          path = Path('src/main/java/com/spacesim/world/StrategicGrowthPlanService.java')
          text = path.read_text()
          pattern = re.compile(
              r'(private static FactionStrategicState copyWithGoals\(\s*'
              r'FactionStrategicState state,\s*List<FactionStrategicGoalState> goals\) \{\s*'
              r'return new FactionStrategicState\(\s*'
              r'state\.factionContentId\(\),\s*state\.minimumMarketAccessRelation\(\),\s*'
              r'state\.relations\(\),\s*state\.controlledSystems\(\),\s*'
              r'state\.stationTaxBasisPoints\(\),\s*state\.foreignTerritoryTariffBasisPoints\(\),\s*'
              r'state\.stockPolicies\(\),\s*state\.productionPolicies\(\),\s*)goals\);')
          replacement = r'''\1goals,
                  state.territorialClaims(),
                  state.territorialControlStates(),
                  state.territorialRecognitions(),
                  state.constructionRightsGranted());'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'growth copy regex mismatch: {count}')
          path.write_text(text)

          # Stage-11C physical expansion must use claim -> stabilization -> control, not direct sovereignty.
          path = Path('src/main/java/com/spacesim/world/FactionExpansionRuntime.java')
          text = path.read_text()
          old = '''        if (project.status() == ConstructionProjectStatus.COMPLETED) {
              FactionStrategicState claimed = addControlledSystem(strategy, plan.targetSystemId());
              StrategicGrowthState.Plan established = StrategicGrowthPlanService.transition(
                      plan,
                      StrategicGrowthState.Status.ESTABLISHED,
                      plan.anchorProjectId(),
                      authoritativeTick());
              claimed = StrategicGrowthPlanService.replacePlan(claimed, established);
              releaseAssignedFleet(established);
              replaceStrategy(claimed);
              return established;
          }'''
          new = '''        if (project.status() == ConstructionProjectStatus.COMPLETED) {
              FactionStrategicState current = world.findFactionStrategicState(
                      strategy.factionContentId()).orElseThrow();
              if (current.claimFor(plan.targetSystemId()) == null) {
                  world.declareTerritorialClaim(strategy.factionContentId(), plan.targetSystemId());
                  current = world.findFactionStrategicState(strategy.factionContentId()).orElseThrow();
              }
              if (!strategy.factionContentId().equals(
                      world.controllingFaction(plan.targetSystemId()).orElse(null))) {
                  return plan;
              }
              StrategicGrowthState.Plan established = StrategicGrowthPlanService.transition(
                      plan,
                      StrategicGrowthState.Status.ESTABLISHED,
                      plan.anchorProjectId(),
                      authoritativeTick());
              current = StrategicGrowthPlanService.replacePlan(current, established);
              releaseAssignedFleet(established);
              replaceStrategy(current);
              return established;
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'expansion completion mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''                state.nextFleetIdValue(),
                  state.fleets(),
                  state.fleetJumps());'''
          new = '''                state.nextFleetIdValue(),
                  state.fleets(),
                  state.fleetJumps(),
                  state.factionIdentities());'''
          if text.count(old) != 1:
              raise SystemExit(f'expansion identity preservation mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          start = text.find('    private FactionStrategicState addControlledSystem(')
          end = text.find('\n    private boolean foreignController(', start)
          if start < 0 or end < 0:
              raise SystemExit('addControlledSystem boundaries missing')
          text = text[:start] + text[end:]
          path.write_text(text)

          # Expose a global contested legal state from the authoritative territorial runtime.
          path = Path('src/main/java/com/spacesim/world/TerritorialControlRuntime.java')
          text = path.read_text()
          anchor = '''    String controller(StarSystemId systemId) {
              return systemId == null ? null : controllerBySystem.get(systemId);
          }
'''
          addition = '''
          boolean isContested(StarSystemId systemId) {
              StarSystemId system = requireSystem(systemId);
              for (FactionStrategicState strategy : strategies) {
                  TerritorialClaimState claim = strategy.claimFor(system);
                  if (claim != null && claim.status() == TerritorialClaimState.Status.CONTESTED) {
                      return true;
                  }
              }
              return false;
          }
'''
          if text.count(anchor) != 1:
              raise SystemExit('territorial controller anchor missing')
          path.write_text(text.replace(anchor, anchor + addition, 1))

          # Separate payer, authorization principal and resulting asset faction at the world boundary.
          path = Path('src/main/java/com/spacesim/world/WorldSimulation.java')
          text = path.read_text()
          anchor = '''    public boolean hasTerritorialConstructionRight(
              String grantorFactionContentId,
              String granteeFactionContentId,
              StarSystemId systemId) {
          FactionStrategicState grantor = territorialControlRuntime.find(grantorFactionContentId);
          return grantor != null
                  && grantor.controls(systemId)
                  && grantor.grantsConstructionRightTo(
                          granteeFactionContentId, systemId, getAuthoritativeWorldTick());
      }
'''
          addition = '''
          /**
           * Reports whether the system currently has at least one materially contested territorial claim.
           *
           * @param systemId target system
           * @return true when ordinary uncontested jurisdiction does not exist
           */
          public boolean isTerritoriallyContested(StarSystemId systemId) {
              return territorialControlRuntime.isContested(systemId);
          }
'''
          if text.count(anchor) != 1:
              raise SystemExit('world right anchor missing')
          text = text.replace(anchor, anchor + addition, 1)

          start = text.index('    public ConstructionProjectId createConstructionProject(\n')
          end = text.index('\n    /**\n     * Физически переводит деньги faction treasury', start)
          replacement = '''    public ConstructionProjectId createConstructionProject(
                  String ownerFactionContentId,
                  String stationArchetypeContentId,
                  StarSystemId systemId,
                  float x,
                  float y) {
              return createConstructionProject(
                      ownerFactionContentId,
                      ownerFactionContentId,
                      ownerFactionContentId,
                      stationArchetypeContentId,
                      systemId,
                      x,
                      y);
          }

          /**
           * Creates a project where the authorization principal and resulting asset faction are equal.
           *
           * @param ownerFactionContentId faction treasury payer, or {@code null} for external settlement
           * @param legalFactionContentId faction whose territorial rights authorize and whose identity affiliates the asset
           * @param stationArchetypeContentId constructible station archetype
           * @param systemId target system
           * @param x finite X coordinate
           * @param y finite Y coordinate
           * @return stable project ID
           */
          public ConstructionProjectId createConstructionProject(
                  String ownerFactionContentId,
                  String legalFactionContentId,
                  String stationArchetypeContentId,
                  StarSystemId systemId,
                  float x,
                  float y) {
              return createConstructionProject(
                      ownerFactionContentId,
                      legalFactionContentId,
                      legalFactionContentId,
                      stationArchetypeContentId,
                      systemId,
                      x,
                      y);
          }

          /**
           * Creates one ordinary project after the shared territorial authorization check.
           *
           * <p>Economic payer, authorization principal and resulting asset affiliation are explicit
           * independent dimensions. This prevents personal projects from becoming faction treasury
           * projects or faction assets merely because the builder currently belongs to another faction.</p>
           *
           * @param ownerFactionContentId faction treasury payer, or {@code null} for external settlement
           * @param authorizationFactionContentId faction whose territorial rights are exercised, or {@code null} for unaffiliated private construction
           * @param legalFactionContentId faction assigned to the site/completed asset, or {@code null} for a personal neutral asset
           * @param stationArchetypeContentId constructible station archetype
           * @param systemId target system
           * @param x finite X coordinate
           * @param y finite Y coordinate
           * @return stable project ID
           * @throws IllegalStateException when ordinary construction is not legally authorized
           */
          public ConstructionProjectId createConstructionProject(
                  String ownerFactionContentId,
                  String authorizationFactionContentId,
                  String legalFactionContentId,
                  String stationArchetypeContentId,
                  StarSystemId systemId,
                  float x,
                  float y) {
              TerritorialConstructionAuthorization.Decision authorization =
                      TerritorialConstructionAuthorization.evaluate(
                              this, authorizationFactionContentId, systemId);
              if (!authorization.allowed()) {
                  throw new IllegalStateException(
                          "Construction denied by territorial law: " + authorization.reason()
                                  + " controller=" + authorization.controllingFactionContentId());
              }
              return constructionProjectService.create(
                      ownerFactionContentId,
                      legalFactionContentId,
                      stationArchetypeContentId,
                      systemId,
                      x,
                      y);
          }
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          # Contested jurisdiction is not ordinary unclaimed space.
          path = Path('src/main/java/com/spacesim/world/TerritorialConstructionAuthorization.java')
          text = path.read_text()
          text = text.replace(
              '        /** Foreign faction construction in controlled territory without an explicit right. */\n        FOREIGN_CONTROL_NO_RIGHT',
              '        /** Ordinary construction is suspended while material territorial claims are contested. */\n        CONTESTED_NO_ORDINARY_RIGHT,\n        /** Foreign faction construction in controlled territory without an explicit right. */\n        FOREIGN_CONTROL_NO_RIGHT',
              1)
          old = '''            if (allowed == (reason == Reason.FOREIGN_CONTROL_NO_RIGHT)) {
                  throw new IllegalArgumentException("Construction authorization allowed flag disagrees with reason");
              }'''
          new = '''            boolean deniedReason = reason == Reason.FOREIGN_CONTROL_NO_RIGHT
                      || reason == Reason.CONTESTED_NO_ORDINARY_RIGHT;
              if (allowed == deniedReason) {
                  throw new IllegalArgumentException("Construction authorization allowed flag disagrees with reason");
              }'''
          if text.count(old) != 1:
              raise SystemExit('authorization decision validation mismatch')
          text = text.replace(old, new, 1)
          old = '''        if (legalBuilderFactionContentId == null) {
              return new Decision(
                      true,
                      Reason.PRIVATE_UNAFFILIATED,
                      checkedWorld.controllingFaction(system).orElse(null));
          }'''
          new = '''        String controller = checkedWorld.controllingFaction(system).orElse(null);
          if (checkedWorld.isTerritoriallyContested(system)) {
              return new Decision(false, Reason.CONTESTED_NO_ORDINARY_RIGHT, controller);
          }
          if (legalBuilderFactionContentId == null) {
              return new Decision(true, Reason.PRIVATE_UNAFFILIATED, controller);
          }'''
          if text.count(old) != 1:
              raise SystemExit('private authorization anchor mismatch')
          text = text.replace(old, new, 1)
          old = '        String controller = checkedWorld.controllingFaction(system).orElse(null);\n        if (controller == null) {'
          if text.count(old) != 1:
              raise SystemExit(f'duplicate controller removal mismatch: {text.count(old)}')
          text = text.replace(old, '        if (controller == null) {', 1)
          path.write_text(text)

          # Player uses affiliation as authorization principal, but only a world-defined player faction nationalizes the asset.
          path = Path('src/main/java/com/spacesim/player/PlayerConstructionService.java')
          text = path.read_text()
          old = '''        ConstructionProjectId projectId = runtime.world().createConstructionProject(
          null,
          current.factionContentId(),
          archetypeId,
          placement.systemId(),
          x,
          y);'''
          new = '''        String assetFactionId = playerAssetFactionId(current);
          ConstructionProjectId projectId = runtime.world().createConstructionProject(
                  null,
                  current.factionContentId(),
                  assetFactionId,
                  archetypeId,
                  placement.systemId(),
                  x,
                  y);'''
          if text.count(old) != 1:
              raise SystemExit(f'player create anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''        if (!Objects.equals(current.factionContentId(), state.legalFactionContentId())) {
              throw new IllegalStateException(
                      "Player construction legal faction differs from current affiliation");
          }'''
          new = '''            if (!Objects.equals(assetFactionId, state.legalFactionContentId())) {
                  throw new IllegalStateException(
                          "Player construction asset faction differs from expected affiliation");
              }'''
          if text.count(old) != 1:
              raise SystemExit(f'player legal assertion mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          anchor = '    private ContentCatalog.StationArchetypeDefinition requireConstructible(String value) {'
          helper = '''    private String playerAssetFactionId(PlayerState player) {
              String affiliation = player.factionContentId();
              if (affiliation == null) {
                  return null;
              }
              for (com.spacesim.world.WorldFactionIdentityState identity
                      : runtime.world().getWorldFactionIdentities()) {
                  if (identity.origin() == com.spacesim.world.WorldFactionIdentityState.Origin.PLAYER_CREATED
                          && identity.stableFactionId().equals(affiliation)) {
                      return affiliation;
                  }
              }
              return null;
          }

'''
          if text.count(anchor) != 1:
              raise SystemExit('player helper anchor missing')
          path.write_text(text.replace(anchor, helper + anchor, 1))

          # A focused market fixture explicitly grants the otherwise-unrelated construction right it needs.
          path = Path('src/test/java/com/spacesim/player/PlayerMarketServiceTest.java')
          text = path.read_text()
          old = '''                        String factionId = content.findFaction(stationFaction.factionId).id();
                          PlayerState player = new PlayerState('''
          new = '''                        String factionId = content.findFaction(stationFaction.factionId).id();
                          String controller = world.controllingFaction(DemoGalaxyFactory.ACTIVE_SYSTEM_ID).orElse(null);
                          if (controller != null && !controller.equals(factionId)) {
                              world.grantTerritorialConstructionRight(
                                      controller, factionId, DemoGalaxyFactory.ACTIVE_SYSTEM_ID, -1L);
                          }
                          PlayerState player = new PlayerState('''
          if text.count(old) != 1:
              raise SystemExit(f'player market fixture mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          # Control consequence test measures all real foreign markets rather than assuming one fixture market exists.
          path = Path('src/test/java/com/spacesim/world/Stage17DControlConsequencesAcceptanceTest.java')
          text = path.read_text()
          old = '''        assertEquals(0L, report.taxCollectedMilliCredits());
          assertEquals(10_000L, report.tariffCollectedMilliCredits());
          assertEquals(1, report.tariffedStations());
          assertEquals(treasuryBefore + 10_000L,
                  world.findFactionEconomicState(PLAYER_FACTION).orElseThrow().treasuryMilliCredits());
          assertEquals(90_000L, foreignWallet.getBalanceMilliCredits());

          List<EconomicTransaction> entries = world.findSession(DemoGalaxyFactory.FRONTIER_SYSTEM_ID)
                  .orElseThrow().getLedger().getEntries();
          assertEquals(ledgerBeforeFiscal + 1, entries.size());
          EconomicTransaction transfer = entries.get(entries.size() - 1);
          assertEquals(EconomicTransaction.Type.MONEY_TRANSFER, transfer.type());
          assertEquals("faction-territory-tariff", transfer.reason());'''
          new = '''        assertEquals(0L, report.taxCollectedMilliCredits());
          assertTrue(report.tariffCollectedMilliCredits() > 0L);
          assertTrue(report.tariffedStations() >= 1);
          assertEquals(treasuryBefore + report.tariffCollectedMilliCredits(),
                  world.findFactionEconomicState(PLAYER_FACTION).orElseThrow().treasuryMilliCredits());
          assertEquals(90_000L, foreignWallet.getBalanceMilliCredits());

          List<EconomicTransaction> entries = world.findSession(DemoGalaxyFactory.FRONTIER_SYSTEM_ID)
                  .orElseThrow().getLedger().getEntries();
          assertEquals(ledgerBeforeFiscal + report.tariffedStations(), entries.size());
          for (EconomicTransaction transfer : entries.subList(ledgerBeforeFiscal, entries.size())) {
              assertEquals(EconomicTransaction.Type.MONEY_TRANSFER, transfer.type());
              assertEquals("faction-territory-tariff", transfer.reason());
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'control consequence assertion mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage17d-final-integration-patch.yml
          git add src/main/java/com/spacesim/world/StrategicGrowthPlanService.java \
                  src/main/java/com/spacesim/world/FactionExpansionRuntime.java \
                  src/main/java/com/spacesim/world/TerritorialControlRuntime.java \
                  src/main/java/com/spacesim/world/WorldSimulation.java \
                  src/main/java/com/spacesim/world/TerritorialConstructionAuthorization.java \
                  src/main/java/com/spacesim/player/PlayerConstructionService.java \
                  src/test/java/com/spacesim/player/PlayerMarketServiceTest.java \
                  src/test/java/com/spacesim/world/Stage17DControlConsequencesAcceptanceTest.java
          git commit -m "Complete Stage 17D cross-system integration"
          git push origin HEAD:agent/stage17d-territorial-process
