name: Stage 10C market access

on:
  push:
    branches:
      - agent/stage10c-galactic-route-planner
    paths:
      - .github/workflows/stage10c-market-access.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/stage10c_market_access.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/spacesim/trade/MarketDirectory.java
          git add src/main/java/com/spacesim/trade/TradeRoutePlanner.java
          git rm scripts/stage10c_market_access.py
          git rm .github/workflows/stage10c-market-access.yml
          git commit -m "feat: include market access in pure route planning"
          git push origin HEAD:${GITHUB_REF_NAME}
