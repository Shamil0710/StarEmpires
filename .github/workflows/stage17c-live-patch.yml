name: Stage17C Live Patch

on:
  push:
    branches:
      - agent/stage17c-live-treasury-capitalization

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17c-live-treasury-capitalization
          fetch-depth: 0
      - name: Apply WorldSimulation treasury seam
        shell: bash
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('src/main/java/com/spacesim/world/WorldSimulation.java'); t=p.read_text(); n=base64.b64decode('ICAgIHB1YmxpYyBPcHRpb25hbDxJbnRlZ2VyPiBmaW5kRmFjdGlvblJ1bnRpbWVJZChTdHJpbmcgc3RhYmxlRmFjdGlvbklkKSB7CiAgICAgICAgcmV0dXJuIGZhY3Rpb25JZGVudGl0eVJlc29sdmVyLnJ1bnRpbWVJZChzdGFibGVGYWN0aW9uSWQpOwogICAgfQo=').decode(); r=base64.b64decode('').decode(); assert n in t and 'transferToFactionTreasury(' not in t; p.write_text(t.replace(n,r,1))"
          rm -f .github/workflows/stage17c-live-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add live faction treasury transfer seam"
          git push origin HEAD:agent/stage17c-live-treasury-capitalization
