name: Stage17D Player Market Fixture

on:
  push:
    branches:
      - agent/stage17d-territorial-process

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage17d-territorial-process
          fetch-depth: 0
      - name: Grant fixture concession
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/test/java/com/spacesim/player/PlayerMarketServiceTest.java')
          text = path.read_text()
          marker = '                        String factionId = content.findFaction(stationFaction.factionId).id();\n'
          addition = '\n'.join([
              '                        String controller = world.controllingFaction(',
              '                                DemoGalaxyFactory.ACTIVE_SYSTEM_ID).orElse(null);',
              '                        if (controller != null && !controller.equals(factionId)) {',
              '                            world.grantTerritorialConstructionRight(',
              '                                    controller,',
              '                                    factionId,',
              '                                    DemoGalaxyFactory.ACTIVE_SYSTEM_ID,',
              '                                    -1L);',
              '                        }',
              ''
          ])
          if text.count(marker) != 1:
              raise SystemExit('faction fixture marker mismatch')
          path.write_text(text.replace(marker, marker + addition, 1))
      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage17d-player-market-fixture.yml
          git add src/test/java/com/spacesim/player/PlayerMarketServiceTest.java
          git commit -m "Make player market construction fixture explicit"
          git push origin HEAD:agent/stage17d-territorial-process
