name: Stage 17F.2 fiscal foundation

on:
  push:
    branches:
      - agent/stage17f2-fiscal-policy
    paths:
      - .github/workflows/stage17f2-fiscal-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17f2-fiscal-policy
          fetch-depth: 0
      - name: Apply fiscal policy foundation
        run: python3 scripts/stage17f2_fiscal_foundation.py
      - name: Commit production changes
        run: |
          git rm .github/workflows/stage17f2-fiscal-foundation.yml scripts/stage17f2_fiscal_foundation.py
          git add src/main/java/com/spacesim/world/FactionEconomicState.java
          git add src/main/java/com/spacesim/world/FactionEconomicAccount.java
          git add src/main/java/com/spacesim/world/FactionFiscalPolicyState.java
          git add src/main/java/com/spacesim/world/TerritorialControlRuntime.java
          git add src/main/java/com/spacesim/world/FactionDiplomacyRuntime.java
          git add src/main/java/com/spacesim/world/WorldSimulation.java
          git add src/main/java/com/spacesim/world/FactionInvestmentPlanner.java
          git add src/main/java/com/spacesim/persistence/WorldFiscalPolicyBinary.java
          git add src/main/java/com/spacesim/persistence/WorldStateCodec.java
          git add src/main/java/com/spacesim/player/PlayerFactionFoundationService.java
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git commit -m "Stage 17F.2: add shared fiscal policy foundation"
          git push origin HEAD:agent/stage17f2-fiscal-policy
