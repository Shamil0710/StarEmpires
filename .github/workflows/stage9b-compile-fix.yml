name: Stage 9B compile fix

on:
  push:
    branches: [agent/stage9b-construction-project]
    paths: ['.github/workflows/stage9b-compile-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage9b-construction-project
          fetch-depth: 0
      - name: Fix construction resource sink call and remove diagnostic
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main/java/com/spacesim/world/ConstructionProjectService.java')
          text = p.read_text(encoding='utf-8')
          old = '''            session.getLedger().recordResourceSink(\n                    item.runtimeId(), required, refreshed.constructionSiteEntityId(),\n                    "station-construction:" + refreshed.stationArchetypeContentId());'''
          new = '''            session.getLedger().recordResourceSink(\n                    siteName(refreshed), item.runtimeId(), required,\n                    "station-construction:" + refreshed.stationArchetypeContentId());'''
          if text.count(old) != 1:
              raise SystemExit('Expected resource sink call not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          debug = Path('docs/stage9b_ci_debug.txt')
          if debug.exists():
              debug.unlink()
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/stage9b-compile-fix.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add -A
          git commit -m "fix: record construction material sinks correctly"
          git push origin HEAD:agent/stage9b-construction-project
