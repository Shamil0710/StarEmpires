name: Stage 9A lifecycle patch

on:
  push:
    branches:
      - agent/stage9a-entity-lifecycle
    paths:
      - '.github/workflows/stage9a-lifecycle-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/stage9a-entity-lifecycle
          fetch-depth: 0
      - name: Patch lifecycle integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected fragment not found in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected unique fragment in {path}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # MarketDirectory explicit transient invalidation.
          replace_once(
              'src/main/java/com/spacesim/trade/MarketDirectory.java',
              '''    public MarketDirectory(ContentCatalog contentCatalog) {\n        this.contentCatalog = Objects.requireNonNull(contentCatalog, "ContentCatalog не задан");\n    }\n\n''',
              '''    public MarketDirectory(ContentCatalog contentCatalog) {\n        this.contentCatalog = Objects.requireNonNull(contentCatalog, "ContentCatalog не задан");\n    }\n\n    /**\n     * Немедленно отбрасывает transient market snapshot и все derived shortlist.\n     *\n     * <p>Метод используется lifecycle boundary при удалении рынка. Следующий\n     * {@link #rebuild(Iterable)} построит snapshot только из оставшихся live ECS entities.\n     * Revision меняется сразу, поэтому negative-route caches не могут считать старый snapshot\n     * актуальным даже до следующей полной перестройки.</p>\n     *\n     * @throws IllegalStateException если revision исчерпан\n     */\n    public void invalidate() {\n        if (revision == Long.MAX_VALUE) {\n            throw new IllegalStateException("Диапазон MarketDirectory revision исчерпан");\n        }\n        stations = List.of();\n        byId = Map.of();\n        suppliersByItem = emptyIndex();\n        consumersByItem = emptyIndex();\n        opportunitiesByItem = emptyOpportunityIndex();\n        seenLiveIds.clear();\n        revision++;\n    }\n\n''')

          # TradeAISystem lifecycle cache invalidation hook.
          replace_once(
              'src/main/java/com/spacesim/systems/TradeAISystem.java',
              '''    public EconomicLedger getLedger() {\n        return tradeController.getLedger();\n    }\n\n''',
              '''    public EconomicLedger getLedger() {\n        return tradeController.getLedger();\n    }\n\n    /**\n     * Invalidates transient planner state after authoritative entity removal.\n     *\n     * <p>The removed entity ID is dropped from per-fleet negative-search cache. When the removed\n     * entity was a market, the shared immutable market snapshot is discarded immediately so no\n     * route planner invocation can observe it as a candidate.</p>\n     *\n     * @param removedId persistent ID that left the local simulation\n     * @param marketRemoved whether the removed entity participated as a market station\n     */\n    public void invalidateAfterEntityRemoval(EntityId removedId, boolean marketRemoved) {\n        if (removedId != null) {\n            failedRouteSearches.remove(removedId);\n        }\n        if (marketRemoved) {\n            marketDirectory.invalidate();\n        }\n    }\n\n''')

          # SimulationSession owns authoritative lifecycle API.
          replace_once(
              'src/main/java/com/spacesim/simulation/SimulationSession.java',
              '''import com.spacesim.persistence.EntityIdAllocator;\n''',
              '''import com.spacesim.persistence.EntityId;\nimport com.spacesim.persistence.EntityIdAllocator;\n''')
          replace_once(
              'src/main/java/com/spacesim/simulation/SimulationSession.java',
              '''    private final EntityRegistry entityRegistry;\n    private final AsteroidSpawnSystem asteroidSpawnSystem;\n''',
              '''    private final EntityRegistry entityRegistry;\n    private final EntityLifecycleService entityLifecycleService;\n    private final AsteroidSpawnSystem asteroidSpawnSystem;\n''')
          replace_once(
              'src/main/java/com/spacesim/simulation/SimulationSession.java',
              '''        this.entityIdAllocator = entityIdAllocator;\n        this.entityRegistry = entityRegistry;\n        this.asteroidSpawnSystem = asteroidSpawnSystem;\n''',
              '''        this.entityIdAllocator = entityIdAllocator;\n        this.entityRegistry = entityRegistry;\n        this.entityLifecycleService = new EntityLifecycleService(\n                engine, entityIdAllocator, entityRegistry);\n        this.asteroidSpawnSystem = asteroidSpawnSystem;\n''')
          replace_once(
              'src/main/java/com/spacesim/simulation/SimulationSession.java',
              '''    /** @return Ashley Engine текущей headless-сессии для read-only тестовой диагностики */\n    public Engine getEngine() {\n''',
              '''    /**\n     * Создаёт новую экономически пустую persistent Entity через authoritative lifecycle boundary.\n     *\n     * @param entity detached runtime Entity без EntityIdComponent\n     * @return детерминированно выделенный persistent ID\n     */\n    public EntityId createEntity(Entity entity) {\n        return entityLifecycleService.create(entity);\n    }\n\n    /**\n     * Структурно удаляет экономически пустую Entity и немедленно инвалидирует persistent refs.\n     *\n     * @param id persistent ID либо {@code null}\n     * @return {@code true}, если live Entity была удалена\n     */\n    public boolean removeEntity(EntityId id) {\n        return entityLifecycleService.remove(id);\n    }\n\n    /** @return Ashley Engine текущей headless-сессии для read-only тестовой диагностики */\n    public Engine getEngine() {\n''')

          # WorldSimulation delegates lifecycle to both active and remote local sessions.
          replace_once(
              'src/main/java/com/spacesim/world/WorldSimulation.java',
              '''import com.spacesim.content.ContentCatalogLoader;\nimport com.spacesim.simulation.SimulationSession;\n''',
              '''import com.spacesim.content.ContentCatalogLoader;\nimport com.spacesim.persistence.EntityId;\nimport com.spacesim.simulation.SimulationSession;\n''')
          replace_once(
              'src/main/java/com/spacesim/world/WorldSimulation.java',
              '''    /** @return immutable Galaxy topology этого runtime world */\n    public GalaxyTopology getTopology() {\n''',
              '''    /**\n     * Создаёт persistent Entity в указанной active или remote StarSystem.\n     *\n     * @param systemId существующая StarSystem\n     * @param entity detached экономически пустая Entity без persistent ID\n     * @return новый system-local persistent EntityId\n     * @throws NullPointerException если system ID или Entity не заданы\n     * @throws IllegalArgumentException если StarSystem отсутствует\n     */\n    public EntityId createEntity(StarSystemId systemId, Entity entity) {\n        return requireLifecycleSession(systemId).createEntity(\n                Objects.requireNonNull(entity, "Создаваемая Entity не задана"));\n    }\n\n    /**\n     * Структурно удаляет экономически пустую Entity из active или remote StarSystem.\n     *\n     * @param systemId существующая StarSystem\n     * @param entityId persistent ID либо {@code null}\n     * @return {@code true}, если Entity существовала и была удалена\n     * @throws NullPointerException если system ID не задан\n     * @throws IllegalArgumentException если StarSystem отсутствует\n     */\n    public boolean removeEntity(StarSystemId systemId, EntityId entityId) {\n        return requireLifecycleSession(systemId).removeEntity(entityId);\n    }\n\n    /** @return immutable Galaxy topology этого runtime world */\n    public GalaxyTopology getTopology() {\n''')
          replace_once(
              'src/main/java/com/spacesim/world/WorldSimulation.java',
              '''    private FactionEconomicAccount requireFactionAccount(String factionId) {\n''',
              '''    private SimulationSession requireLifecycleSession(StarSystemId systemId) {\n        StarSystemId checked = Objects.requireNonNull(systemId, "StarSystemId lifecycle не задан");\n        SimulationSession session = sessionsById.get(checked);\n        if (session == null) {\n            throw new IllegalArgumentException("Неизвестная StarSystem: " + checked);\n        }\n        return session;\n    }\n\n    private FactionEconomicAccount requireFactionAccount(String factionId) {\n''')
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/stage9a-lifecycle-patch.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add src/main/java .github/workflows/stage9a-lifecycle-patch.yml
          git commit -m "feat: integrate Stage 9A entity lifecycle"
          git push origin HEAD:agent/stage9a-entity-lifecycle
