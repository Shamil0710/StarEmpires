name: Stage 17C roadmap sync

on:
  push:
    branches:
      - agent/stage17c-aggregate-acceptance
    paths:
      - .github/workflows/stage17c-roadmap-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17c-aggregate-acceptance
      - name: Synchronize canonical Stage 17 status
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/development_roadmap.md")
          text = path.read_text(encoding="utf-8")
          old_section = "## 17C — personal wallet ↔ faction treasury\n\nДва разных economic accounts. Любой transfer atomic и ledger-visible; faction income не становится автоматически личными деньгами игрока.\n"
          new_section = "## 17C — personal wallet ↔ faction treasury\n\n**COMPLETE — PR #94/#95/#96, финальный aggregate gate PR #97.**\n\nPersonal wallet, faction treasury и station operating wallets остаются разными authoritative accounts. Explicit transfers `personal ↔ treasury` выполняются атомарно и ledger-visible в обоих направлениях. Ordinary station→treasury faction income не меняет personal wallet автоматически. Aggregate acceptance доказывает conservation трёх счетов, physical-state invariants и binary save/load.\n"
          if old_section not in text:
              raise SystemExit("Stage 17C roadmap section anchor not found")
          text = text.replace(old_section, new_section, 1)
          old_order = "3. 17C personal wallet ↔ faction treasury;\n4. 17D territory/control/construction access;\n"
          new_order = "3. 17C personal wallet ↔ faction treasury — COMPLETE (PR #97);\n4. 17D territory/control/construction access — NEXT;\n"
          if old_order not in text:
              raise SystemExit("Immediate Stage 17 order anchor not found")
          text = text.replace(old_order, new_order, 1)
          old_base = "- Stage-17 identity/asset-affiliation implementation уже движется на `main`;"
          new_base = "- Stage-17 identity/asset-affiliation и conserved treasury boundary уже находятся на `main`;"
          if old_base not in text:
              raise SystemExit("Current Stage 17 factual base anchor not found")
          text = text.replace(old_base, new_base, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove synchronizer and commit roadmap
        run: |
          rm .github/workflows/stage17c-roadmap-sync.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add docs/development_roadmap.md .github/workflows/stage17c-roadmap-sync.yml
          git commit -m "Mark Stage 17C complete and advance roadmap to 17D"
          git push
