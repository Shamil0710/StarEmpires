name: World planner factory

on:
  push:
    branches:
      - agent/stage10c-galactic-route-planner
    paths:
      - .github/workflows/world-planner-factory.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/world_planner_factory.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/spacesim/world/WorldSimulation.java
          git rm scripts/world_planner_factory.py
          git rm .github/workflows/world-planner-factory.yml
          git commit -m "feat: expose world galactic planners"
          git push origin HEAD:${GITHUB_REF_NAME}
