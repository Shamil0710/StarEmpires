name: Finalize Stage 10B roadmap

on:
  push:
    branches:
      - agent/stage10b-jump-transit
    paths:
      - .github/workflows/stage10b-roadmap-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Update roadmap
        run: python3 scripts/stage10b_roadmap_finalize.py
      - name: Commit roadmap and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development_roadmap.md
          git rm scripts/stage10b_roadmap_finalize.py
          git rm .github/workflows/stage10b-roadmap-finalize.yml
          git commit -m "docs: complete Stage 10B roadmap status"
          git push origin HEAD:${GITHUB_REF_NAME}
