name: Stage 9E diagnostic

on:
  push:
    branches:
      - agent/stage9e-resilience-benchmark
    paths:
      - .github/workflows/stage9e-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage9e-resilience-benchmark
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run targeted Stage 9E acceptance test
        shell: bash
        run: |
          set +e
          ./mvnw -B -Dtest=Stage9ERecoveryBenchmarkTest test > /tmp/stage9e.log 2>&1
          code=$?
          {
            echo "exit_code=$code"
            echo "--- tail ---"
            tail -n 240 /tmp/stage9e.log
          } > docs/stage9e_diagnostic.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add docs/stage9e_diagnostic.txt
          git commit -m "chore: capture Stage 9E diagnostic"
          git push origin HEAD:agent/stage9e-resilience-benchmark
