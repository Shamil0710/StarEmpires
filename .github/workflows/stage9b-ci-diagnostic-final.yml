name: Stage 9B final verify diagnostic

on:
  push:
    branches: [agent/stage9b-construction-project]
    paths: ['.github/workflows/stage9b-ci-diagnostic-final.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage9b-construction-project
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture full verify result
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress clean verify > /tmp/stage9b-final.log 2>&1
          code=$?
          {
            echo "exit_code=$code"
            echo "--- last 600 lines ---"
            tail -n 600 /tmp/stage9b-final.log
          } > docs/stage9b_ci_debug_final.txt
          exit 0
      - name: Commit diagnostic and remove workflow
        run: |
          rm .github/workflows/stage9b-ci-diagnostic-final.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add docs/stage9b_ci_debug_final.txt .github/workflows/stage9b-ci-diagnostic-final.yml
          git commit -m "chore: capture final Stage 9B verify gate"
          git push origin HEAD:agent/stage9b-construction-project
