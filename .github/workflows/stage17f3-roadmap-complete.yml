name: Stage 17F.3 roadmap completion

on:
  push:
    branches:
      - stage-17f3-fiscal-tradeoffs
    paths:
      - .github/workflows/stage17f3-roadmap-complete.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage-17f3-fiscal-tradeoffs
          fetch-depth: 0
      - name: Update roadmap
        run: python3 scripts/stage17f3_roadmap_complete.py
      - name: Commit roadmap completion
        run: |
          git rm .github/workflows/stage17f3-roadmap-complete.yml scripts/stage17f3_roadmap_complete.py
          git add docs/development_roadmap.md
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git commit -m "Mark Stage 17F.3 complete in roadmap"
          git push origin HEAD:stage-17f3-fiscal-tradeoffs
