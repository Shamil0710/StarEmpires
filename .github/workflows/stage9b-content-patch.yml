name: Stage 9B content patch

on:
  push:
    branches: [agent/stage9b-construction-project]
    paths: ['.github/workflows/stage9b-content-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage9b-construction-project
          fetch-depth: 0
      - name: Add data-driven station construction definitions
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one fragment, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ContentCatalog station fingerprint + records.
          replace_once(
              'src/main/java/com/spacesim/content/ContentCatalog.java',
              '''                    .append(Double.doubleToLongBits(station.startingCredits())).append('|')\n                    .append(station.factionId()).append('|').append(station.recipeId()).append('|');\n            List<MarketDefinition> markets = new ArrayList<>(station.markets());''',
              '''                    .append(Double.doubleToLongBits(station.startingCredits())).append('|')\n                    .append(station.factionId()).append('|').append(station.recipeId()).append('|');\n            ConstructionDefinition construction = station.construction();\n            if (construction == null) {\n                canonical.append("construction=none|");\n            } else {\n                canonical.append("construction=")\n                        .append(Double.doubleToLongBits(construction.fundingCredits())).append(',')\n                        .append(Float.floatToIntBits(construction.buildSeconds())).append(',');\n                appendAmounts(canonical, construction.materials());\n                canonical.append('|');\n            }\n            List<MarketDefinition> markets = new ArrayList<>(station.markets());''')

          replace_once(
              'src/main/java/com/spacesim/content/ContentCatalog.java',
              '''    public record StationArchetypeDefinition(\n            String id, String displayName, int inventoryCapacity, double startingCredits,\n            String factionId, String recipeId, List<MarketDefinition> markets) {''',
              '''    /**\n     * Data-driven physical construction requirements of a station archetype.\n     *\n     * @param fundingCredits minimum project liquidity funded from faction treasury\n     * @param buildSeconds build duration after all materials have arrived\n     * @param materials required positive item amounts by persistent item ID\n     */\n    public record ConstructionDefinition(\n            double fundingCredits, float buildSeconds, Map<String, Integer> materials) {\n        /** Validates immutable construction requirements. */\n        public ConstructionDefinition {\n            if (!Double.isFinite(fundingCredits) || fundingCredits <= 0d\n                    || !Float.isFinite(buildSeconds) || buildSeconds <= 0f) {\n                throw new IllegalArgumentException("Construction funding/build duration должны быть положительными");\n            }\n            materials = immutableOrderedCopy(Objects.requireNonNull(materials, "Construction materials не заданы"));\n            if (materials.isEmpty()) {\n                throw new IllegalArgumentException("ConstructionDefinition требует materials");\n            }\n            for (Map.Entry<String, Integer> entry : materials.entrySet()) {\n                Objects.requireNonNull(entry.getKey(), "Construction item ID не задан");\n                if (entry.getValue() == null || entry.getValue() <= 0) {\n                    throw new IllegalArgumentException("Construction material amount должен быть положительным");\n                }\n            }\n        }\n    }\n\n    public record StationArchetypeDefinition(\n            String id, String displayName, int inventoryCapacity, double startingCredits,\n            String factionId, String recipeId, List<MarketDefinition> markets,\n            ConstructionDefinition construction) {''')

          replace_once(
              'src/main/java/com/spacesim/content/ContentCatalog.java',
              '''         * @param markets рыночные правила по товарам\n         */\n        public StationArchetypeDefinition {''',
              '''         * @param markets рыночные правила по товарам\n         * @param construction optional data-driven construction requirements; null means archetype is not constructible\n         */\n        public StationArchetypeDefinition {''')

          # Loader parses optional construction so narrow legacy test catalogs remain source-compatible.
          replace_once(
              'src/main/java/com/spacesim/content/ContentCatalogLoader.java',
              '''        if (totalInitialStock > capacity) {\n            throw new IllegalArgumentException("Стартовый stock station archetype превышает capacity: " + id);\n        }\n        return new ContentCatalog.StationArchetypeDefinition(\n                id,\n                requireNonBlank(node, "displayName"),\n                capacity,\n                credits,\n                factionId,\n                recipeId,\n                markets);\n    }\n\n    private static Map<String, Integer> parseAmounts(''',
              '''        if (totalInitialStock > capacity) {\n            throw new IllegalArgumentException("Стартовый stock station archetype превышает capacity: " + id);\n        }\n        ContentCatalog.ConstructionDefinition construction = parseConstruction(\n                node.get("construction"), id, itemsById);\n        return new ContentCatalog.StationArchetypeDefinition(\n                id,\n                requireNonBlank(node, "displayName"),\n                capacity,\n                credits,\n                factionId,\n                recipeId,\n                markets,\n                construction);\n    }\n\n    private static ContentCatalog.ConstructionDefinition parseConstruction(\n            JsonValue node,\n            String stationId,\n            Map<String, ContentCatalog.ItemDefinition> itemsById) {\n        if (node == null || node.isNull()) {\n            return null;\n        }\n        JsonValue value = requireObject(node, "station construction");\n        double fundingCredits = requireDouble(value, "fundingCredits");\n        float buildSeconds = requireFloat(value, "buildSeconds");\n        if (!Double.isFinite(fundingCredits) || fundingCredits <= 0d\n                || !Float.isFinite(buildSeconds) || buildSeconds <= 0f) {\n            throw new IllegalArgumentException("Некорректные construction funding/buildSeconds: " + stationId);\n        }\n        Map<String, Integer> materials = parseAmounts(\n                value.get("materials"), stationId, "construction.materials", itemsById);\n        if (materials.isEmpty()) {\n            throw new IllegalArgumentException("Station construction требует materials: " + stationId);\n        }\n        return new ContentCatalog.ConstructionDefinition(fundingCredits, buildSeconds, materials);\n    }\n\n    private static Map<String, Integer> parseAmounts(''')

          # Production catalog gets explicit physical requirements. Keep schema version unchanged:
          # this is semantic content, therefore fingerprint changes naturally.
          path = Path('src/main/resources/data/content/catalog-v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          definitions = {
              'station.mining_base': (25000.0, 25.0, {'item.steel': 120, 'item.energy': 60}),
              'station.power_plant': (25000.0, 25.0, {'item.steel': 100, 'item.energy': 80}),
              'station.agrodome': (30000.0, 30.0, {'item.steel': 120, 'item.energy': 100}),
              'station.foundry': (40000.0, 35.0, {'item.steel': 180, 'item.energy': 120}),
              'station.arsenal': (50000.0, 40.0, {'item.steel': 220, 'item.energy': 160}),
              'station.colony': (75000.0, 50.0, {'item.steel': 300, 'item.energy': 200}),
          }
          for station in data['stationArchetypes']:
              funding, seconds, materials = definitions[station['id']]
              station['construction'] = {
                  'fundingCredits': funding,
                  'buildSeconds': seconds,
                  'materials': materials,
              }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/stage9b-content-patch.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add src/main/java/com/spacesim/content src/main/resources/data/content/catalog-v1.json .github/workflows/stage9b-content-patch.yml
          git commit -m "feat: make station construction requirements data-driven"
          git push origin HEAD:agent/stage9b-construction-project
