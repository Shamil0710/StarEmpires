name: Stage 17E.2 world integration

on:
  push:
    branches:
      - agent/stage17e-treaty-lifecycle

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage17e-treaty-lifecycle
          fetch-depth: 0

      - name: Integrate treaty command boundary
        shell: bash
        run: python3 .github/stage17e2/apply.py

      - name: Self-remove integrator and commit
        shell: bash
        run: |
          rm -rf .github/stage17e2
          rm .github/workflows/stage17e2-world-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/spacesim/world/FactionDiplomacyRuntime.java \
                  src/main/java/com/spacesim/world/WorldSimulation.java \
                  docs/development_roadmap.md \
                  .github/stage17e2 \
                  .github/workflows/stage17e2-world-integration.yml
          git diff --cached --check
          git commit -m "Stage 17E.2: integrate authoritative treaty lifecycle"
          git push origin HEAD:agent/stage17e-treaty-lifecycle
