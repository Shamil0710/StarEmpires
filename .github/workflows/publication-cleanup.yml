name: Publication cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publication-cleanup.yml

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Remove stale artifacts and merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Delete old Actions artifacts until storage is below target and remove merged branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const protectedBranches = new Set([defaultBranch]);
            for (const pull of openPulls) {
              if (pull.head.repo?.full_name === `${owner}/${repo}`) {
                protectedBranches.add(pull.head.ref);
              }
            }

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100
            });
            const activeArtifacts = artifacts.filter(a => !a.expired);
            let totalBytes = activeArtifacts.reduce((sum, a) => sum + a.size_in_bytes, 0);
            const targetBytes = 100 * 1024 * 1024;
            const sortedArtifacts = [...activeArtifacts].sort((a, b) => b.size_in_bytes - a.size_in_bytes);
            let deletedArtifacts = 0;
            let deletedBytes = 0;
            for (const artifact of sortedArtifacts) {
              if (totalBytes <= targetBytes) {
                break;
              }
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              totalBytes -= artifact.size_in_bytes;
              deletedBytes += artifact.size_in_bytes;
              deletedArtifacts++;
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });
            let deletedBranches = 0;
            const preservedUniqueBranches = [];
            for (const branch of branches) {
              if (protectedBranches.has(branch.name)) {
                continue;
              }
              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: defaultBranch,
                head: branch.name
              });
              if (comparison.data.ahead_by === 0) {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch.name}` });
                deletedBranches++;
              } else {
                preservedUniqueBranches.push(branch.name);
              }
            }

            core.summary
              .addHeading('Publication cleanup')
              .addRaw(`Deleted artifacts: ${deletedArtifacts}\n`)
              .addRaw(`Freed artifact bytes: ${deletedBytes}\n`)
              .addRaw(`Estimated remaining artifact bytes: ${Math.max(totalBytes, 0)}\n`)
              .addRaw(`Deleted branches already contained in ${defaultBranch}: ${deletedBranches}\n`)
              .addRaw(`Protected/open-PR branches: ${[...protectedBranches].sort().join(', ')}\n`)
              .addRaw(`Branches preserved because they still contain unique commits: ${preservedUniqueBranches.sort().join(', ') || 'none'}\n`)
              .write();
