name: Stage 17E.6 treaty credibility

on:
  push:
    branches:
      - agent/stage17e-treaty-credibility
    paths:
      - .github/workflows/stage17e6-apply.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17e-treaty-credibility
      - name: Apply treaty credibility patch
        run: python .github/scripts/stage17e6_patch.py
      - name: Commit and remove applicator
        run: |
          rm .github/scripts/stage17e6_patch.py .github/workflows/stage17e6-apply.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add src/main/java/com/spacesim/world/FactionDiplomacyRuntime.java .github/scripts/stage17e6_patch.py .github/workflows/stage17e6-apply.yml
          git commit -m "Stage 17E.6: reward observable treaty compliance"
          git push
