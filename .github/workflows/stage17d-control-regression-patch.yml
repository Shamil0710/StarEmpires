name: Stage17D Control Regression Patch

on:
  push:
    branches:
      - agent/stage17d-territorial-process

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage17d-territorial-process
          fetch-depth: 0
      - name: Patch territorial maintenance
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/main/java/com/spacesim/world/TerritorialControlRuntime.java')
          text = path.read_text()
          old = '    static final long CONTROL_LOSS_GRACE_TICKS = 300L;'
          new = '    static final long CONTROL_LOSS_GRACE_TICKS = 3_600L;'
          if text.count(old) != 1:
              raise SystemExit('control-loss constant anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''        for (FactionStrategicState rival : strategies) {
                  if (rival.factionContentId().equals(controllerFactionId)) {
                      continue;
                  }
                  Evidence rivalEvidence = evidence.getOrDefault(
                          new EvidenceKey(rival.factionContentId(), systemId), Evidence.NONE);
                  if (rivalEvidence.qualifiesForControl()
                          && rivalEvidence.controlScore() + CONTEST_MARGIN >= controllerEvidence.controlScore()) {
                      return true;
                  }
              }
          '''
          new = '''        for (FactionStrategicState rival : strategies) {
                  if (rival.factionContentId().equals(controllerFactionId)
                          || rival.claimFor(systemId) == null) {
                      continue;
                  }
                  Evidence rivalEvidence = evidence.getOrDefault(
                          new EvidenceKey(rival.factionContentId(), systemId), Evidence.NONE);
                  if (rivalEvidence.qualifiesForControl()
                          && rivalEvidence.controlScore() + CONTEST_MARGIN >= controllerEvidence.controlScore()) {
                      return true;
                  }
              }
          '''
          if text.count(old) != 1:
              raise SystemExit('rival-threat anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage17d-control-regression-patch.yml
          git add src/main/java/com/spacesim/world/TerritorialControlRuntime.java
          git commit -m "Harden territorial control maintenance"
          git push origin HEAD:agent/stage17d-territorial-process
