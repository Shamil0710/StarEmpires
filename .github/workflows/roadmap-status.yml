name: Roadmap status

on:
  push:
    branches:
      - agent/stage10c-galactic-route-planner
    paths:
      - .github/workflows/roadmap-status.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/roadmap_status.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development_roadmap.md
          git rm scripts/roadmap_status.py
          git rm .github/workflows/roadmap-status.yml
          git commit -m "docs: complete Stage 10C roadmap status"
          git push origin HEAD:${GITHUB_REF_NAME}
