name: Stage 17E.7 item-demand routing fix

on:
  push:
    branches:
      - agent/stage17e-economic-dependence-diagnostics
    paths:
      - .github/workflows/stage17e7-route-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17e-economic-dependence-diagnostics
      - name: Apply route semantics fix
        run: python .github/scripts/stage17e7_route_patch.py
      - name: Commit and remove applicator
        run: |
          rm .github/scripts/stage17e7_route_patch.py .github/workflows/stage17e7-route-fix.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add src/main/java/com/spacesim/world/FactionEconomicDependenceAnalyzer.java .github/scripts/stage17e7_route_patch.py .github/workflows/stage17e7-route-fix.yml
          git commit -m "Stage 17E.7: route dependence from commodity demand"
          git push
