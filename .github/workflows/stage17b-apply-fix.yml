name: Stage17B Apply Fix

on:
  push:
    branches:
      - agent/stage17b-transit-fleet-affiliation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17b-transit-fleet-affiliation
          fetch-depth: 0
      - name: Apply runtime faction-capacity fix and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          profile = Path('src/main/java/com/spacesim/trade/FleetTradeProfile.java')
          text = profile.read_text()
          old = text
          text = text.replace('factionId >= Constants.MAX_FACTIONS', 'factionId >= Constants.FACTION_RUNTIME_CAPACITY')
          text = text.replace('reputation.length != Constants.MAX_FACTIONS', 'reputation.length != Constants.FACTION_RUNTIME_CAPACITY')
          if text == old:
              raise SystemExit('FleetTradeProfile replacements were not applied')
          profile.write_text(text)

          ai = Path('src/main/java/com/spacesim/systems/TradeAISystem.java')
          text = ai.read_text()
          old = text
          text = text.replace('float[] reputation = new float[Constants.MAX_FACTIONS];',
                              'float[] reputation = new float[Constants.FACTION_RUNTIME_CAPACITY];')
          text = text.replace('factionId < Constants.MAX_FACTIONS; factionId++',
                              'factionId < Constants.FACTION_RUNTIME_CAPACITY; factionId++')
          if text == old:
              raise SystemExit('TradeAISystem replacements were not applied')
          ai.write_text(text)

          test = Path('src/test/java/com/spacesim/trade/Stage17DynamicFactionTradeProfileTest.java')
          test.write_text('''package com.spacesim.trade;\n\nimport com.spacesim.constants.Constants;\nimport org.junit.jupiter.api.Test;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\nimport static org.junit.jupiter.api.Assertions.assertThrows;\n\nclass Stage17DynamicFactionTradeProfileTest {\n    @Test\n    void acceptsDynamicRuntimeFactionSlotsAndFullReputationVector() {\n        int dynamicFactionId = Constants.LEGACY_FACTION_COUNT;\n        float[] reputation = new float[Constants.FACTION_RUNTIME_CAPACITY];\n        reputation[dynamicFactionId] = 12.5f;\n        reputation[Constants.FACTION_RUNTIME_CAPACITY - 1] = -7.25f;\n\n        FleetTradeProfile profile = new FleetTradeProfile(\n                0f, 0f, 10f, 1_000L, 10, 0, 10, -1, false, null,\n                dynamicFactionId, new int[Constants.MAX_ITEMS], reputation);\n\n        assertEquals(dynamicFactionId, profile.factionId());\n        assertEquals(12.5f, profile.reputation(dynamicFactionId));\n        assertEquals(-7.25f, profile.reputation(Constants.FACTION_RUNTIME_CAPACITY - 1));\n    }\n\n    @Test\n    void rejectsFactionOutsideRuntimeCapacity() {\n        float[] reputation = new float[Constants.FACTION_RUNTIME_CAPACITY];\n        assertThrows(IllegalArgumentException.class, () -> new FleetTradeProfile(\n                0f, 0f, 10f, 1_000L, 10, 0, 10, -1, false, null,\n                Constants.FACTION_RUNTIME_CAPACITY, new int[Constants.MAX_ITEMS], reputation));\n    }\n}\n''')
          PY
          rm -f .github/workflows/stage17b-apply-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix dynamic faction trade profile capacity"
          git push origin HEAD:agent/stage17b-transit-fleet-affiliation
