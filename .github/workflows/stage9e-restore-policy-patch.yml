name: Stage 9E restore policy patch

on:
  push:
    branches:
      - agent/stage9e-readywork5
    paths:
      - .github/workflows/stage9e-restore-policy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage9e-readywork5
          fetch-depth: 0
      - name: Restore derived construction market policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/spacesim/world/ConstructionProjectService.java')
          text = path.read_text(encoding='utf-8')
          old = ('        Entity site = requireSite(state);\n'
                 '        ConstructionProjectState refreshed = refresh(state);\n'
                 '        if (refreshed.projectWalletMilliCredits() != state.projectWalletMilliCredits()')
          new = ('        Entity site = requireSite(state);\n'
                 '        ConstructionSiteFactory.restoreDerivedPolicy(catalog, target, site);\n'
                 '        ConstructionProjectState refreshed = refresh(state);\n'
                 '        if (refreshed.projectWalletMilliCredits() != state.projectWalletMilliCredits()')
          if text.count(old) != 1:
              raise SystemExit('ConstructionProjectService restore marker mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/stage9e-restore-policy-patch.yml').unlink()
          PY
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add src/main/java/com/spacesim/world/ConstructionProjectService.java .github/workflows/stage9e-restore-policy-patch.yml
          git commit -m "fix: restore derived construction procurement policy"
          git push origin HEAD:agent/stage9e-readywork5
