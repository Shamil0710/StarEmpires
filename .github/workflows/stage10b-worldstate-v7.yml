name: Stage 10B WorldState v7

on:
  push:
    branches:
      - agent/stage10b-jump-transit
    paths:
      - .github/workflows/stage10b-worldstate-v7.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Apply reviewed WorldState patch
        run: git apply scripts/stage10b_worldstate_v7.patch
      - name: Commit result and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/spacesim/world/WorldState.java
          git rm scripts/stage10b_worldstate_v7.patch
          git rm .github/workflows/stage10b-worldstate-v7.yml
          git commit -m "feat: persist Stage 10B jump state schema"
          git push origin HEAD:${GITHUB_REF_NAME}
