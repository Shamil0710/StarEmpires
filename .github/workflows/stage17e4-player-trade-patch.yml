name: Stage 17E.4 player trade patch

on:
  push:
    branches:
      - agent/stage17e-customs-tariffs
    paths:
      - .github/workflows/stage17e4-player-trade-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17e-customs-tariffs
      - name: Patch player trade adapters
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path_str):
              p=Path(path_str)
              t=p.read_text(encoding='utf-8')
              def r(old,new,label):
                  nonlocal t
                  if t.count(old)!=1:
                      raise SystemExit(f'{path_str} {label}: {t.count(old)} anchors')
                  t=t.replace(old,new,1)
              if 'PlayerMarketService' in path_str:
                  r('import com.spacesim.content.ContentCatalog;\n',
                    'import com.spacesim.content.ContentCatalog;\nimport com.spacesim.constants.Constants;\n', 'constants import')
                  r('''        if (player.factionContentId() != null) {
            ContentCatalog.FactionDefinition faction = content.findFaction(player.factionContentId());
            if (faction == null) {
                return null;
            }
            proxy.add(new FactionComponent(faction.runtimeId()));
        }
        ReputationComponent proxyReputation = new ReputationComponent();
        for (PlayerReputationState reputation : player.reputations()) {
            ContentCatalog.FactionDefinition faction = content.findFaction(reputation.factionContentId());
            if (faction == null) {
                return null;
            }
            proxyReputation.addReputation(faction.runtimeId(), reputation.value());
        }
        proxy.add(proxyReputation);
        return new TradeContext(
                player, session, ship, station, shipInventory, stationInventory, market,
                new TradeController(session.getLedger()), proxy, proxyWallet, proxyReputation);''',
                    '''        if (player.factionContentId() != null) {
            int runtimeFactionId = runtime.world().findFactionRuntimeId(player.factionContentId()).orElse(-1);
            if (runtimeFactionId < 0) {
                return null;
            }
            proxy.add(new FactionComponent(runtimeFactionId));
        }
        ReputationComponent proxyReputation = new ReputationComponent();
        for (PlayerReputationState reputation : player.reputations()) {
            int runtimeFactionId = runtime.world().findFactionRuntimeId(reputation.factionContentId()).orElse(-1);
            if (runtimeFactionId < 0) {
                return null;
            }
            proxyReputation.addReputation(runtimeFactionId, reputation.value());
        }
        proxy.add(proxyReputation);
        return new TradeContext(
                player, session, ship, station, shipInventory, stationInventory, market,
                runtime.world().createTradeController(session), proxy, proxyWallet, proxyReputation);''', 'context resolver')
                  r('''    private List<PlayerReputationState> snapshotReputation(ReputationComponent reputation) {
        List<PlayerReputationState> result = new ArrayList<>();
        for (ContentCatalog.FactionDefinition faction : content.getFactions()) {
            float value = reputation.getReputation(faction.runtimeId());
            if (value != 0f) {
                result.add(new PlayerReputationState(faction.id(), value));
            }
        }
        return result;
    }''',
                    '''    private List<PlayerReputationState> snapshotReputation(ReputationComponent reputation) {
        List<PlayerReputationState> result = new ArrayList<>();
        for (int runtimeId = 0; runtimeId < Constants.FACTION_RUNTIME_CAPACITY; runtimeId++) {
            String stableId = runtime.world().findFactionStableId(runtimeId).orElse(null);
            float value = reputation.getReputation(runtimeId);
            if (stableId != null && value != 0f) {
                result.add(new PlayerReputationState(stableId, value));
            }
        }
        return result;
    }''', 'snapshot resolver')
              else:
                  r('import com.spacesim.content.ContentCatalog;\n',
                    'import com.spacesim.content.ContentCatalog;\nimport com.spacesim.constants.Constants;\n', 'constants import')
                  r('''        if (player.factionContentId() != null) {
            ContentCatalog.FactionDefinition faction = content.findFaction(player.factionContentId());
            if (faction == null) {
                return null;
            }
            proxy.add(new FactionComponent(faction.runtimeId()));
        }
        ReputationComponent proxyReputation = new ReputationComponent();
        for (PlayerReputationState reputation : player.reputations()) {
            ContentCatalog.FactionDefinition faction = content.findFaction(reputation.factionContentId());
            if (faction == null) {
                return null;
            }
            proxyReputation.addReputation(faction.runtimeId(), reputation.value());
        }
        proxy.add(proxyReputation);
        return new Context(
                player,
                physical.shipRole(),
                physical.station(),
                physical.shipInventory(),
                physical.stationInventory(),
                physical.stationWallet(),
                item,
                new TradeController(physical.session().getLedger()),
                proxy,
                proxyWallet,
                proxyReputation);''',
                    '''        if (player.factionContentId() != null) {
            int runtimeFactionId = runtime.world().findFactionRuntimeId(player.factionContentId()).orElse(-1);
            if (runtimeFactionId < 0) {
                return null;
            }
            proxy.add(new FactionComponent(runtimeFactionId));
        }
        ReputationComponent proxyReputation = new ReputationComponent();
        for (PlayerReputationState reputation : player.reputations()) {
            int runtimeFactionId = runtime.world().findFactionRuntimeId(reputation.factionContentId()).orElse(-1);
            if (runtimeFactionId < 0) {
                return null;
            }
            proxyReputation.addReputation(runtimeFactionId, reputation.value());
        }
        proxy.add(proxyReputation);
        return new Context(
                player,
                physical.shipRole(),
                physical.station(),
                physical.shipInventory(),
                physical.stationInventory(),
                physical.stationWallet(),
                item,
                runtime.world().createTradeController(physical.session()),
                proxy,
                proxyWallet,
                proxyReputation);''', 'context resolver')
                  r('''    private List<PlayerReputationState> snapshotReputation(ReputationComponent reputation) {
        List<PlayerReputationState> result = new ArrayList<>();
        for (ContentCatalog.FactionDefinition faction : content.getFactions()) {
            float value = reputation.getReputation(faction.runtimeId());
            if (value != 0f) {
                result.add(new PlayerReputationState(faction.id(), value));
            }
        }
        return result;
    }''',
                    '''    private List<PlayerReputationState> snapshotReputation(ReputationComponent reputation) {
        List<PlayerReputationState> result = new ArrayList<>();
        for (int runtimeId = 0; runtimeId < Constants.FACTION_RUNTIME_CAPACITY; runtimeId++) {
            String stableId = runtime.world().findFactionStableId(runtimeId).orElse(null);
            float value = reputation.getReputation(runtimeId);
            if (stableId != null && value != 0f) {
                result.add(new PlayerReputationState(stableId, value));
            }
        }
        return result;
    }''', 'snapshot resolver')
              p.write_text(t,encoding='utf-8')

          patch('src/main/java/com/spacesim/player/PlayerMarketService.java')
          patch('src/main/java/com/spacesim/player/PlayerFleetEconomyService.java')
          PY
      - name: Remove applicator and commit
        run: |
          rm .github/workflows/stage17e4-player-trade-patch.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add src/main/java/com/spacesim/player/PlayerMarketService.java src/main/java/com/spacesim/player/PlayerFleetEconomyService.java .github/workflows/stage17e4-player-trade-patch.yml
          git commit -m "Stage 17E.4: unify player trade faction resolution"
          git push
