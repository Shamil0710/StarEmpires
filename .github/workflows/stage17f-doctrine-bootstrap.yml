name: Stage 17F doctrine bootstrap

on:
  push:
    branches:
      - agent/stage17f-doctrine-profile
    paths:
      - .github/workflows/stage17f-doctrine-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17f-doctrine-profile
          fetch-depth: 0
      - name: Apply doctrine foundation
        run: python3 scripts/stage17f_doctrine_bootstrap.py
      - name: Commit foundation
        run: |
          git rm .github/workflows/stage17f-doctrine-bootstrap.yml scripts/stage17f_doctrine_bootstrap.py
          git add src/main/java/com/spacesim/world/FactionDoctrineState.java
          git add src/main/java/com/spacesim/world/FactionDoctrineDecisionPolicy.java
          git add src/main/java/com/spacesim/world/FactionStrategicState.java
          git add src/main/java/com/spacesim/world/DiplomaticTreatyEvaluator.java
          git add src/main/java/com/spacesim/persistence/WorldDoctrineBinary.java
          git add src/main/java/com/spacesim/persistence/WorldStateCodec.java
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git commit -m "Stage 17F.1: persist faction doctrine profiles"
          git push origin HEAD:agent/stage17f-doctrine-profile
