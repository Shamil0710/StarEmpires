name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 17 verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test, check coverage, build Javadoc and package desktop JAR
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      # Artifact storage is a publication convenience, not a correctness gate. The mandatory
      # Maven verify step above already fails the job on tests, JaCoCo, strict Javadoc or package
      # errors. Do not let temporary GitHub artifact-storage failures turn a green verification
      # into a false code regression.
      - name: Upload desktop application and reports
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: star-empires-${{ github.sha }}
          path: |
            target/star-empires-*-all.jar
            target/site/jacoco/
            target/site/apidocs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
