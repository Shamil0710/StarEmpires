name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 17 verification
    runs-on: ubuntu-latest
    # The green pre-B07/B08 baseline takes about 14 minutes. M22.6 now also runs mirrored
    # generated-world freight/combat/production and multidimensional burden acceptance, so keep
    # the verification command and gates unchanged while allowing the deterministic suite to finish.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test, check coverage, build Javadoc and package desktop JAR
        shell: bash
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress clean verify 2>&1 | tee maven-verify.log

      - name: Retain core-pair raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage22-evidence-${{ github.sha }}
          path: target/stage22-evidence/
          if-no-files-found: ignore
          retention-days: 7

      # Artifact publication is deliberately restricted to main. Pull requests still execute the
      # exact same mandatory Maven verification gate, but routine branch/PR runs no longer retain a
      # large shaded JAR, JaCoCo report and Javadocs on every commit. Stage-20 representative seed
      # evidence is emitted by the test suite and retained only from the authoritative main run.
      - name: Upload desktop application and reports
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: star-empires-${{ github.sha }}
          path: |
            target/star-empires-*-all.jar
            target/site/jacoco/
            target/site/apidocs/
            target/stage20e-evidence/
          if-no-files-found: error
          retention-days: 7

      # Keep the exact Maven gate fail-closed while retaining enough post-test diagnostics to
      # distinguish Surefire, strict Javadoc, JaCoCo and packaging failures. This is observability
      # only: the original clean verify exit status is preserved by pipefail.
      - name: Upload failed verification diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics-${{ github.sha }}
          path: |
            maven-verify.log
            target/surefire-reports/
            target/site/jacoco/
            target/site/apidocs/
            target/jacoco.exec
          if-no-files-found: ignore
          retention-days: 3
