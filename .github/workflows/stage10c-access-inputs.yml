name: Stage 10C access inputs

on:
  push:
    branches:
      - agent/stage10c-galactic-route-planner
    paths:
      - .github/workflows/stage10c-access-inputs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/stage10c_access_inputs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/spacesim/trade/FleetTradeProfile.java
          git add src/main/java/com/spacesim/systems/TradeAISystem.java
          git rm scripts/stage10c_access_inputs.py
          git rm .github/workflows/stage10c-access-inputs.yml
          git commit -m "feat: add faction identity to trade planning inputs"
          git push origin HEAD:${GITHUB_REF_NAME}
