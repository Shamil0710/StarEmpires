name: Stage 17E.4 sequential integration

on:
  push:
    branches:
      - agent/stage17e-customs-tariffs
    paths:
      - .github/workflows/stage17e4-finish.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17e-customs-tariffs
      - name: Apply integration
        run: python .github/scripts/stage17e4_finish.py
      - name: Commit and remove applicator
        run: |
          rm .github/scripts/stage17e4_finish.py .github/workflows/stage17e4-finish.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add src/main/java .github/scripts/stage17e4_finish.py .github/workflows/stage17e4-finish.yml
          git commit -m "Stage 17E.4: integrate physical customs tariffs"
          git push
