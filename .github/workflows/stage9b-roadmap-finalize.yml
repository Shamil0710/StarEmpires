name: Stage 9B roadmap finalizer

on:
  push:
    branches: [agent/stage9b-construction-project]
    paths: ['.github/workflows/stage9b-roadmap-finalize.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage9b-construction-project
          fetch-depth: 0
      - name: Complete 9B and activate 9C
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/development_roadmap.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Текущий implementation focus: **Stage 9B — Persistent Construction Project**.',
              'Текущий implementation focus: **Stage 9C — Destruction и economic shock**.', 1)
          start = text.index('### Stage 9B — Persistent Construction Project')
          end = text.index('### Stage 9C — Destruction и economic shock', start)
          section = text[start:end]
          section = section.replace('**Статус:** ACTIVE', '**Статус:** COMPLETE — PR #14 candidate; `docs/stage9b_construction_project.md`', 1)
          section = section.replace('- [ ]', '- [x]')
          text = text[:start] + section + text[end:]
          text = text.replace(
              '### Stage 9C — Destruction и economic shock\n\n#### Задачи',
              '### Stage 9C — Destruction и economic shock\n\n**Статус:** ACTIVE\n\n#### Задачи', 1)
          text = text.replace(
              '**ACTIVE: Stage 9B — Persistent Construction Project.**',
              '**ACTIVE: Stage 9C — Destruction и economic shock.**', 1)
          old = '''Immediate implementation sequence:\n\n1. persistent `ConstructionProject` ID/state model и state machine;\n2. data-driven material requirements для station archetype;\n3. project wallet и physical faction funding;\n4. project storage и частичные material deliveries;\n5. save/load continuation construction progress;\n6. completion через Stage-9A lifecycle без magic stock/money creation;\n7. cancellation/refund policy с conservation tests;\n8. затем Stage 9C destruction/economic shock.'''
          new = '''Immediate implementation sequence:\n\n1. explicit destruction API поверх Stage-9A structural removal;\n2. определить cargo/stock fate `DESTROY / SALVAGE / TRANSFER`;\n3. определить money/wallet fate без silent currency loss;\n4. ledger accounting для уничтоженных ресурсов и transfers;\n5. physical salvage entity при выбранной salvage policy;\n6. immediate production/market removal и route invalidation;\n7. events/news hook для значимых потерь;\n8. economic-shock tests, затем Stage 9D bottleneck analysis.'''
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/stage9b-roadmap-finalize.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add docs/development_roadmap.md .github/workflows/stage9b-roadmap-finalize.yml
          git commit -m "docs: complete Stage 9B and activate Stage 9C"
          git push origin HEAD:agent/stage9b-construction-project
