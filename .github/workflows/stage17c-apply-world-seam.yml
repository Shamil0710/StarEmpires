name: Stage17C Apply World Seam

on:
  push:
    branches:
      - agent/stage17c-faction-treasury-capitalization

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17c-faction-treasury-capitalization
          fetch-depth: 0
      - name: Add faction treasury transfer seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/spacesim/world/WorldSimulation.java')
          text = p.read_text()
          needle = '''    public Optional<Integer> findFactionRuntimeId(String stableFactionId) {
        return factionIdentityResolver.runtimeId(stableFactionId);
    }
'''
          insert = needle + '''
    /**
     * Returns the current authoritative treasury balance for an authored or world-defined faction.
     *
     * @param stableFactionId stable faction identity; null/blank is treated as absent
     * @return treasury balance when the faction has ordinary Stage-8 economic state
     */
    public Optional<Long> findFactionTreasuryBalance(String stableFactionId) {
        if (stableFactionId == null || stableFactionId.isBlank()) {
            return Optional.empty();
        }
        FactionEconomicAccount account = factionAccountsById.get(stableFactionId.strip());
        return account == null
                ? Optional.empty()
                : Optional.of(account.treasury().getBalanceMilliCredits());
    }

    /**
     * Transfers real money from an external authoritative wallet into an ordinary faction treasury.
     *
     * <p>This is a transfer boundary, never a source. Both wallets are checked before mutation and
     * the active-system ledger records one MONEY_TRANSFER. If ledger recording fails after the
     * wallet move, the wallet transfer is reversed before the exception escapes.</p>
     *
     * @param factionContentId stable destination faction identity
     * @param sourceWallet authoritative source wallet owned by the caller
     * @param sourceLedgerName non-empty diagnostic source name
     * @param amountMilliCredits strictly positive full-transfer amount
     * @param reason non-empty ledger reason
     * @return true when the full transfer and ledger record completed; false when wallet capacity rejects it
     * @throws IllegalArgumentException if faction, amount, source name or reason is invalid
     * @throws NullPointerException if source wallet is missing
     */
    public boolean transferToFactionTreasury(
            String factionContentId,
            WalletComponent sourceWallet,
            String sourceLedgerName,
            long amountMilliCredits,
            String reason) {
        String factionId = normalizedFactionId(factionContentId);
        FactionEconomicAccount account = requireFactionAccount(factionId);
        WalletComponent source = Objects.requireNonNull(sourceWallet, "Treasury source wallet not set");
        String sourceName = Objects.requireNonNull(sourceLedgerName, "Treasury source ledger name not set").strip();
        String transferReason = Objects.requireNonNull(reason, "Treasury transfer reason not set").strip();
        if (sourceName.isEmpty() || transferReason.isEmpty()) {
            throw new IllegalArgumentException("Treasury transfer ledger labels cannot be blank");
        }
        if (amountMilliCredits <= 0L) {
            throw new IllegalArgumentException("Treasury transfer amount must be positive");
        }
        WalletComponent treasury = account.treasury();
        if (!source.canDebit(amountMilliCredits) || !treasury.canCredit(amountMilliCredits)) {
            return false;
        }
        if (!source.transferTo(treasury, amountMilliCredits)) {
            return false;
        }
        try {
            sessionsById.get(activeSystemId).getLedger().recordMoneyTransfer(
                    sourceName,
                    treasuryName(factionId),
                    amountMilliCredits,
                    transferReason);
            return true;
        } catch (RuntimeException exception) {
            if (!treasury.transferTo(source, amountMilliCredits)) {
                exception.addSuppressed(new IllegalStateException(
                        "Faction treasury transfer rollback could not restore money"));
            }
            throw exception;
        }
    }
'''
          if needle not in text:
              raise SystemExit('findFactionRuntimeId insertion point not found')
          if 'findFactionTreasuryBalance' in text:
              raise SystemExit('treasury seam already present')
          p.write_text(text.replace(needle, insert, 1))
          PY
          rm -f .github/workflows/stage17c-apply-world-seam.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add authoritative faction treasury transfer seam"
          git push origin HEAD:agent/stage17c-faction-treasury-capitalization
