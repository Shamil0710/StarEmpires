name: Stage 9C final diagnostic

on:
  push:
    branches: [agent/stage9c-destruction-shock]
    paths: ['.github/workflows/stage9c-final-diagnostic.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage9c-destruction-shock
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture verify tail
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress clean verify > /tmp/stage9c-final.log 2>&1
          code=$?
          { echo "exit_code=$code"; echo "--- tail ---"; tail -n 600 /tmp/stage9c-final.log; } > docs/stage9c_ci_debug_final.txt
          exit 0
      - name: Commit diagnostic and remove workflow
        run: |
          rm .github/workflows/stage9c-final-diagnostic.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add docs/stage9c_ci_debug_final.txt .github/workflows/stage9c-final-diagnostic.yml
          git commit -m "chore: capture Stage 9C final failure"
          git push origin HEAD:agent/stage9c-destruction-shock
