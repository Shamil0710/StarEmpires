name: Stage17D Construction Boundary Patch

on:
  push:
    branches:
      - agent/stage17d-territorial-process

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage17d-territorial-process
          fetch-depth: 0
      - name: Patch construction service and world boundary
        shell: python
        run: |
          from pathlib import Path

          service_path = Path('src/main/java/com/spacesim/world/ConstructionProjectService.java')
          text = service_path.read_text()

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          one(
              'import com.spacesim.components.InventoryComponent;\n',
              'import com.spacesim.components.FactionComponent;\nimport com.spacesim.components.InventoryComponent;\n',
              'FactionComponent import')
          one(
              '    private final ContentCatalog catalog;\n    private final Map<StarSystemId, SimulationSession> sessionsById;',
              '    private final ContentCatalog catalog;\n    private final FactionIdentityResolver factionIdentityResolver;\n    private final Map<StarSystemId, SimulationSession> sessionsById;',
              'resolver field')
          one(
              '''    ConstructionProjectService(
                      ContentCatalog catalog,
                      Map<StarSystemId, SimulationSession> sessionsById,''',
              '''    ConstructionProjectService(
                      ContentCatalog catalog,
                      FactionIdentityResolver factionIdentityResolver,
                      Map<StarSystemId, SimulationSession> sessionsById,''',
              'constructor signature')
          one(
              '        this.catalog = Objects.requireNonNull(catalog, "ContentCatalog construction не задан");\n        this.sessionsById = Objects.requireNonNull(sessionsById, "Construction sessions не заданы");',
              '        this.catalog = Objects.requireNonNull(catalog, "ContentCatalog construction не задан");\n        this.factionIdentityResolver = Objects.requireNonNull(\n                factionIdentityResolver, "FactionIdentityResolver construction not set");\n        this.sessionsById = Objects.requireNonNull(sessionsById, "Construction sessions не заданы");',
              'constructor resolver init')

          start = text.index('    ConstructionProjectId create(\n')
          end = text.index('\n    long fund(', start)
          replacement = '''    ConstructionProjectId create(
                  String ownerFactionContentId,
                  String stationArchetypeContentId,
                  StarSystemId systemId,
                  float x,
                  float y) {
              return create(
                      ownerFactionContentId,
                      ownerFactionContentId,
                      stationArchetypeContentId,
                      systemId,
                      x,
                      y);
          }

          ConstructionProjectId create(
                  String ownerFactionContentId,
                  String legalFactionContentId,
                  String stationArchetypeContentId,
                  StarSystemId systemId,
                  float x,
                  float y) {
              final ConstructionSettlementKind settlementKind;
              final String ownerId;
              if (ownerFactionContentId == null) {
                  settlementKind = ConstructionSettlementKind.EXTERNAL_OWNER;
                  ownerId = null;
              } else {
                  ownerId = normalizedId(ownerFactionContentId, "Construction owner faction");
                  requireFactionAccount(ownerId);
                  settlementKind = ConstructionSettlementKind.FACTION_TREASURY;
              }
              final String legalFactionId = legalFactionContentId == null
                      ? null : normalizedId(legalFactionContentId, "Construction legal faction");
              final Integer legalFactionRuntimeId = requireLegalFaction(legalFactionId);

              ContentCatalog.StationArchetypeDefinition target = requireConstructible(stationArchetypeContentId);
              SimulationSession session = requireSession(systemId);
              if (!Float.isFinite(x) || !Float.isFinite(y)) {
                  throw new IllegalArgumentException("Construction coordinates должны быть конечными");
              }

              ConstructionProjectId projectId = idAllocator.allocate();
              Entity site = ConstructionSiteFactory.create(
                      catalog, projectId, target, legalFactionRuntimeId, x, y);
              EntityId siteId = session.createEntity(site);
              long tick = session.getClock().getTick();
              long minimumFunding = Money.fromCredits(target.construction().fundingCredits());
              ConstructionDurationPolicy.Estimate duration = ConstructionDurationPolicy.estimate(catalog, target);
              long buildDurationTicks = buildDurationTicks(duration.totalSeconds(), session);
              List<ConstructionMaterialState> materials = new ArrayList<>();
              for (Map.Entry<String, Integer> requirement : target.construction().materials().entrySet()) {
                  materials.add(new ConstructionMaterialState(requirement.getKey(), requirement.getValue(), 0));
              }
              materials.sort(ConstructionMaterialState::compareTo);

              ConstructionProjectState state = new ConstructionProjectState(
                      projectId,
                      ownerId,
                      target.id(),
                      systemId,
                      x,
                      y,
                      siteId,
                      materials,
                      minimumFunding,
                      0L,
                      buildDurationTicks,
                      ConstructionProjectStatus.PLANNED,
                      tick,
                      tick,
                      -1L,
                      -1L,
                      null,
                      settlementKind,
                      legalFactionId);
              projects.put(projectId, state);
              return projectId;
          }
          '''
          text = text[:start] + replacement + text[end:]

          one(
              '''        Entity station = ArchetypeEntityFactory.createConstructedStation(
                      catalog,
                      target.id(),
                      target.displayName() + " #" + refreshed.id().value(),
                      refreshed.x(),
                      refreshed.y(),
                      refreshed.legalFactionContentId());
              EntityId stationId = session.createEntity(station);''',
              '''        Integer legalFactionRuntimeId = requireLegalFaction(refreshed.legalFactionContentId());
              Entity station = ArchetypeEntityFactory.createConstructedStation(
                      catalog,
                      target.id(),
                      target.displayName() + " #" + refreshed.id().value(),
                      refreshed.x(),
                      refreshed.y(),
                      null);
              if (legalFactionRuntimeId != null) {
                  station.add(new FactionComponent(legalFactionRuntimeId));
              }
              EntityId stationId = session.createEntity(station);''',
              'completion faction materialization')
          one(
              '''    private void requireLegalFaction(String factionId) {
              if (factionId != null && catalog.findFaction(factionId) == null) {
                  throw new IllegalArgumentException("Construction legal faction неизвестна: " + factionId);
              }
          }''',
              '''    private Integer requireLegalFaction(String factionId) {
              if (factionId == null) {
                  return null;
              }
              return factionIdentityResolver.runtimeId(factionId).orElseThrow(
                      () -> new IllegalArgumentException("Construction legal faction неизвестна: " + factionId));
          }''',
              'legal faction resolver')
          service_path.write_text(text)

          world_path = Path('src/main/java/com/spacesim/world/WorldSimulation.java')
          world = world_path.read_text()
          old = '''        this.constructionProjectService = new ConstructionProjectService(
                      contentCatalog,
                      this.sessionsById,'''
          new = '''        this.constructionProjectService = new ConstructionProjectService(
                      contentCatalog,
                      this.factionIdentityResolver,
                      this.sessionsById,'''
          if world.count(old) != 1:
              raise SystemExit(f'World constructor anchor mismatch: {world.count(old)}')
          world = world.replace(old, new, 1)

          start = world.index('    public ConstructionProjectId createConstructionProject(\n')
          end = world.index('\n    /**\n     * Физически переводит деньги faction treasury', start)
          replacement = '''    public ConstructionProjectId createConstructionProject(
                  String ownerFactionContentId,
                  String stationArchetypeContentId,
                  StarSystemId systemId,
                  float x,
                  float y) {
              return createConstructionProject(
                      ownerFactionContentId,
                      ownerFactionContentId,
                      stationArchetypeContentId,
                      systemId,
                      x,
                      y);
          }

          /**
           * Creates one ordinary construction project after shared territorial authorization.
           *
           * <p>Settlement and legal identity are intentionally separate. For example, a player may
           * personally fund a station represented legally by the player's faction. No caller can
           * bypass territorial construction law through the direct world API.</p>
           *
           * @param ownerFactionContentId faction treasury payer, or {@code null} for external settlement
           * @param legalFactionContentId faction represented by the project, or {@code null} for private unaffiliated construction
           * @param stationArchetypeContentId constructible station archetype
           * @param systemId target system
           * @param x finite X coordinate
           * @param y finite Y coordinate
           * @return stable world construction project ID
           * @throws IllegalStateException when ordinary legal construction is not authorized
           */
          public ConstructionProjectId createConstructionProject(
                  String ownerFactionContentId,
                  String legalFactionContentId,
                  String stationArchetypeContentId,
                  StarSystemId systemId,
                  float x,
                  float y) {
              TerritorialConstructionAuthorization.Decision authorization =
                      TerritorialConstructionAuthorization.evaluate(this, legalFactionContentId, systemId);
              if (!authorization.allowed()) {
                  throw new IllegalStateException(
                          "Construction denied by territorial law: " + authorization.reason()
                                  + " controller=" + authorization.controllingFactionContentId());
              }
              return constructionProjectService.create(
                      ownerFactionContentId,
                      legalFactionContentId,
                      stationArchetypeContentId,
                      systemId,
                      x,
                      y);
          }
          '''
          world = world[:start] + replacement + world[end:]
          world_path.write_text(world)
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage17d-construction-boundary-patch.yml
          git add src/main/java/com/spacesim/world/ConstructionProjectService.java src/main/java/com/spacesim/world/WorldSimulation.java
          git commit -m "Enforce territorial construction authorization"
          git push origin HEAD:agent/stage17d-territorial-process
