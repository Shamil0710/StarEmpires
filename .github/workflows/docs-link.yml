name: Documentation link

on:
  push:
    branches:
      - agent/stage10c-galactic-route-planner
    paths:
      - .github/workflows/docs-link.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/docs_link.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development_roadmap.md docs/stage10c_galactic_route_planner.md
          git rm scripts/docs_link.py
          git rm .github/workflows/docs-link.yml
          git commit -m "docs: link Stage 10C PR"
          git push origin HEAD:${GITHUB_REF_NAME}
