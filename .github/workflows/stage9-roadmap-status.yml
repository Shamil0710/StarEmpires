name: Stage 9 roadmap status

on:
  push:
    branches:
      - agent/stage9e-readywork5
    paths:
      - .github/workflows/stage9-roadmap-status.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage9e-readywork5
          fetch-depth: 0
      - name: Update roadmap status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/development_roadmap.md')
          s = p.read_text(encoding='utf-8')
          pairs = [
              ('**Статус:** ACTIVE — STAGE 8.5 GATE PASSED\n\nТекущий implementation focus: **Stage 9E — Economic resilience benchmark**.',
               '**Статус:** COMPLETE — Stage 9E acceptance passed\n\nТекущий implementation focus: **Stage 10A — Fleet identity на world level**.'),
              ('**Статус:** COMPLETE — PR #16 candidate; `docs/stage9d_economic_response.md`',
               '**Статус:** COMPLETE — PR #17; `docs/stage9d_economic_response.md`'),
              ('### Stage 9E — Economic resilience benchmark\n\n**Статус:** ACTIVE',
               '### Stage 9E — Economic resilience benchmark\n\n**Статус:** COMPLETE — PR #18 candidate; `docs/stage9e_economic_resilience.md`'),
              ('## Stage 10 — Inter-system logistics и физическое перемещение между системами\n\n**Статус:** PLANNED',
               '## Stage 10 — Inter-system logistics и физическое перемещение между системами\n\n**Статус:** ACTIVE'),
          ]
          for old, new in pairs:
              if s.count(old) != 1:
                  raise SystemExit('roadmap marker mismatch')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/stage9-roadmap-status.yml').unlink()
          PY
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add docs/development_roadmap.md .github/workflows/stage9-roadmap-status.yml
          git commit -m "docs: complete Stage 9 and activate Stage 10"
          git push origin HEAD:agent/stage9e-readywork5
