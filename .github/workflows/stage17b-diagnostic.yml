name: Stage17B Verify Diagnostic

on:
  push:
    branches:
      - agent/stage17b-transit-fleet-affiliation

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[stage17b-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17b-transit-fleet-affiliation
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Capture exact source and targeted stack
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress \
            -Dtest=Stage17TransitFleetAffiliationAcceptanceTest#transitAffiliationSurvivesMidJumpSaveLoadAndOrdinaryArrival \
            -DtrimStackTrace=false test > /tmp/stage17b-target.log 2>&1
          status=$?
          {
            echo "target_test_exit_code=$status"
            echo "--- SOURCE MATCHES ---"
            grep -R -n -F "Некорректный runtime faction ID флота" src || true
            echo "--- STACK / ERROR ---"
            grep -n -E "Stage17TransitFleetAffiliationAcceptanceTest|Некорректный runtime faction|IllegalArgumentException|at com\.spacesim|Caused by|Failures:|Errors:" /tmp/stage17b-target.log | tail -n 260
            echo "--- TARGET LOG TAIL ---"
            tail -n 220 /tmp/stage17b-target.log
          } > stage17b-source-diagnostic.log
          exit 0
      - name: Commit diagnostic summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage17b-source-diagnostic.log
          git commit -m "[stage17b-diagnostic] capture source and targeted stack"
          git push origin HEAD:agent/stage17b-transit-fleet-affiliation
