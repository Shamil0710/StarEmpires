name: Stage17B Verify Diagnostic

on:
  push:
    branches:
      - agent/stage17b-transit-fleet-affiliation

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[stage17b-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17b-transit-fleet-affiliation
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Capture verify failure summary
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress clean verify > /tmp/stage17b-verify.log 2>&1
          status=$?
          {
            echo "verify_exit_code=$status"
            echo "--- ERROR / FAILURE SUMMARY ---"
            grep -E '^\[ERROR\]|Failures:|Errors:|BUILD FAILURE|COMPILATION ERROR|Javadoc|coverage|Coverage' /tmp/stage17b-verify.log | tail -n 240
            echo "--- LOG TAIL ---"
            tail -n 160 /tmp/stage17b-verify.log
          } > stage17b-diagnostic.log
          exit 0
      - name: Commit diagnostic summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage17b-diagnostic.log
          git commit -m "[stage17b-diagnostic] capture verify failure"
          git push origin HEAD:agent/stage17b-transit-fleet-affiliation
