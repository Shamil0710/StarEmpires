name: Apply political-economy roadmap

on:
  push:
    branches:
      - agent/roadmap-political-economy-diplomacy
    paths:
      - .github/workflows/apply-political-roadmap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/roadmap-political-economy-diplomacy
      - name: Apply roadmap sections
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path("docs/development_roadmap.md")
          text = roadmap.read_text(encoding="utf-8")

          old_top = '> Последняя синхронизация: **2026-08-15 после принятия `Ship Mathematics v1.0 Design Baseline` (PR #91, CI #1516, merge `3ec2f6cab286dbcd39694c19a055d038c175b59c`) и подробной post-v1 декомпозиции Stage 17.5 / 19 / 21. Фактический runtime-статус остаётся Stage 17 ACTIVE.**'
          new_top = '> Последняя синхронизация: **2026-08-15 после закрытия Stage 17C и подробной фиксации политико-экономической архитектуры Stage 17D–17F / Stage 18; `Ship Mathematics v1.0 Design Baseline` остаётся accepted foundation для 17.5 / 19 / 21. Фактический runtime-статус — Stage 17 ACTIVE, следующий implementation slice — 17D.**'
          if old_top not in text:
              raise SystemExit("Roadmap sync header anchor not found")
          text = text.replace(old_top, new_top, 1)

          def replace_between(source, start_marker, end_marker, patch_path, suffix="\n\n"):
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit(f"Start marker not found: {start_marker}")
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"End marker not found: {end_marker}")
              patch = Path(patch_path).read_text(encoding="utf-8").rstrip()
              return source[:start] + patch + suffix + source[end:]

          text = replace_between(
              text,
              "Stage 17 переиспользует Stage-8 faction core:",
              "## 17A — player faction identity / creation contract",
              ".roadmap-patch/political_contract.md")
          text = replace_between(
              text,
              "## 17D — territory / control / construction access",
              "## 17G — faction management UI / global map",
              ".roadmap-patch/stage17d_f.md")
          text = replace_between(
              text,
              "# Stage 18 — strategic warfare + advanced combat behavior",
              "### v0.4 DoD",
              ".roadmap-patch/stage18.md")
          text = replace_between(
              text,
              "# Stage 20 — NPC / missions / reputation / progression",
              "# MILESTONE v0.6 — CONTENT & BALANCE ALPHA",
              ".roadmap-patch/stage20.md",
              "\n\n---\n\n")

          roadmap.write_text(text, encoding="utf-8")
          PY
      - name: Remove temporary patch inputs and commit roadmap
        run: |
          rm -rf .roadmap-patch
          rm .github/workflows/apply-political-roadmap.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add docs/development_roadmap.md .roadmap-patch .github/workflows/apply-political-roadmap.yml
          git commit -m "Detail faction politics and diplomacy roadmap"
          git push
