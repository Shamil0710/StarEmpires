name: Stage17B Final Diagnostic

on:
  push:
    branches:
      - agent/stage17b-transit-fleet-affiliation

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[stage17b-final-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17b-transit-fleet-affiliation
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Capture verify summary
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress clean verify > /tmp/verify.log 2>&1
          status=$?
          {
            echo "verify_exit_code=$status"
            echo "--- FAILURES ---"
            grep -n -E '^\[ERROR\]|<<< FAILURE|Tests run: .*Failures: [1-9]|Tests run: .*Errors: [1-9]|COMPILATION ERROR|BUILD FAILURE|Javadoc|jacoco' /tmp/verify.log | tail -n 320
            echo "--- TAIL ---"
            tail -n 220 /tmp/verify.log
          } > stage17b-final-diagnostic.log
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage17b-final-diagnostic.log
          git commit -m "[stage17b-final-diagnostic] capture verify failure"
          git push origin HEAD:agent/stage17b-transit-fleet-affiliation
