name: Stage17D Expansion Patch V2

on:
  push:
    branches:
      - agent/stage17d-territorial-process

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage17d-territorial-process
          fetch-depth: 0
      - name: Patch expansion integration
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main/java/com/spacesim/world/StrategicGrowthPlanService.java')
          text = path.read_text()
          old = '''        return new FactionStrategicState(
                  state.factionContentId(),
                  state.minimumMarketAccessRelation(),
                  state.relations(),
                  state.controlledSystems(),
                  state.stationTaxBasisPoints(),
                  state.foreignTerritoryTariffBasisPoints(),
                  state.stockPolicies(),
                  state.productionPolicies(),
                  goals);'''
          new = '''        return new FactionStrategicState(
                  state.factionContentId(),
                  state.minimumMarketAccessRelation(),
                  state.relations(),
                  state.controlledSystems(),
                  state.stationTaxBasisPoints(),
                  state.foreignTerritoryTariffBasisPoints(),
                  state.stockPolicies(),
                  state.productionPolicies(),
                  goals,
                  state.territorialClaims(),
                  state.territorialControlStates(),
                  state.territorialRecognitions(),
                  state.constructionRightsGranted());'''
          if text.count(old) != 1:
              raise SystemExit('growth copy anchor mismatch: ' + str(text.count(old)))
          path.write_text(text.replace(old, new, 1))

          path = Path('src/main/java/com/spacesim/world/FactionExpansionRuntime.java')
          text = path.read_text()
          old = '''        if (project.status() == ConstructionProjectStatus.COMPLETED) {
              FactionStrategicState claimed = addControlledSystem(strategy, plan.targetSystemId());
              StrategicGrowthState.Plan established = StrategicGrowthPlanService.transition(
                      plan,
                      StrategicGrowthState.Status.ESTABLISHED,
                      plan.anchorProjectId(),
                      authoritativeTick());
              claimed = StrategicGrowthPlanService.replacePlan(claimed, established);
              releaseAssignedFleet(established);
              replaceStrategy(claimed);
              return established;
          }'''
          new = '''        if (project.status() == ConstructionProjectStatus.COMPLETED) {
              FactionStrategicState current = world.findFactionStrategicState(
                      strategy.factionContentId()).orElseThrow();
              if (current.claimFor(plan.targetSystemId()) == null) {
                  world.declareTerritorialClaim(strategy.factionContentId(), plan.targetSystemId());
                  current = world.findFactionStrategicState(strategy.factionContentId()).orElseThrow();
              }
              if (!strategy.factionContentId().equals(
                      world.controllingFaction(plan.targetSystemId()).orElse(null))) {
                  return plan;
              }
              StrategicGrowthState.Plan established = StrategicGrowthPlanService.transition(
                      plan,
                      StrategicGrowthState.Status.ESTABLISHED,
                      plan.anchorProjectId(),
                      authoritativeTick());
              current = StrategicGrowthPlanService.replacePlan(current, established);
              releaseAssignedFleet(established);
              replaceStrategy(current);
              return established;
          }'''
          if text.count(old) != 1:
              raise SystemExit('expansion completion anchor mismatch: ' + str(text.count(old)))
          text = text.replace(old, new, 1)
          old = '''                state.nextFleetIdValue(),
                  state.fleets(),
                  state.fleetJumps());'''
          new = '''                state.nextFleetIdValue(),
                  state.fleets(),
                  state.fleetJumps(),
                  state.factionIdentities());'''
          if text.count(old) != 1:
              raise SystemExit('identity preservation anchor mismatch: ' + str(text.count(old)))
          text = text.replace(old, new, 1)
          start = text.find('    private FactionStrategicState addControlledSystem(')
          end = text.find('\n    private boolean foreignController(', start)
          if start < 0 or end < 0:
              raise SystemExit('addControlledSystem boundaries missing')
          path.write_text(text[:start] + text[end:])
      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage17d-expansion-patch-v2.yml
          git add src/main/java/com/spacesim/world/StrategicGrowthPlanService.java src/main/java/com/spacesim/world/FactionExpansionRuntime.java
          git commit -m "Route Stage 11 expansion through territorial claims"
          git push origin HEAD:agent/stage17d-territorial-process
