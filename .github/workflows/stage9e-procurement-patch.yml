name: Stage 9E procurement patch

on:
  push:
    branches:
      - agent/stage9e-readywork3
    paths:
      - .github/workflows/stage9e-procurement-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage9e-readywork3
          fetch-depth: 0
      - name: Apply focused TradeAI procurement routing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/spacesim/systems/TradeAISystem.java')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'import com.spacesim.components.EntityIdComponent;\n',
                  'import com.spacesim.components.EntityIdComponent;\nimport com.spacesim.components.FactionComponent;\n'
              ),
              (
                  'import com.spacesim.components.MarketComponent;\n',
                  'import com.spacesim.components.MarketComponent;\nimport com.spacesim.components.ProcurementPolicyComponent;\n'
              ),
              (
                  'import java.util.HashMap;\n',
                  'import java.util.ArrayList;\nimport java.util.HashMap;\nimport java.util.List;\n'
              ),
              (
                  '    private final ComponentMapper<InventoryComponent> im = ComponentMapper.getFor(InventoryComponent.class);\n',
                  '    private final ComponentMapper<InventoryComponent> im = ComponentMapper.getFor(InventoryComponent.class);\n'
                  '    private final ComponentMapper<FactionComponent> fm = ComponentMapper.getFor(FactionComponent.class);\n'
                  '    private final ComponentMapper<ProcurementPolicyComponent> ppm =\n'
                  '            ComponentMapper.getFor(ProcurementPolicyComponent.class);\n'
              ),
              (
                  '            routeFound = im.get(fleet).getTotalStock() > 0\n'
                  '                    ? findSellRoute(ai, profile)\n'
                  '                    : findTradeRoute(ai, profile);',
                  '            routeFound = im.get(fleet).getTotalStock() > 0\n'
                  '                    ? findFactionProcurementSale(fleet, ai, profile) || findSellRoute(ai, profile)\n'
                  '                    : findTradeRoute(ai, profile);'
              ),
              (
                  '    private boolean findSellRoute(TradeAIComponent ai, FleetTradeProfile profile) {\n'
                  '        ai.resetRoute();\n'
                  '        TradeSaleRoute route = routePlanner.findBestExistingCargoSale(profile, marketDirectory).orElse(null);\n'
                  '        if (route == null) {\n'
                  '            return false;\n'
                  '        }\n\n'
                  '        ai.buyStationId = null;\n'
                  '        ai.sellStationId = route.sellStationId();\n'
                  '        ai.targetStationId = route.sellStationId();\n'
                  '        ai.targetItem = route.itemId();\n'
                  '        ai.targetAmount = route.amount();\n'
                  '        ai.expectedProfitMilliCredits = route.saleRevenueMilliCredits();\n'
                  '        ai.routeSearchCooldown = 0f;\n'
                  '        ai.state = TradeAIComponent.State.TRAVEL_TO_SELL;\n'
                  '        return true;\n'
                  '    }',
                  '    private boolean findFactionProcurementSale(\n'
                  '            Entity fleet, TradeAIComponent ai, FleetTradeProfile profile) {\n'
                  '        FactionComponent fleetFaction = fm.get(fleet);\n'
                  '        if (fleetFaction == null || marketStations == null) {\n'
                  '            return false;\n'
                  '        }\n'
                  '        List<Entity> procurementMarkets = new ArrayList<>();\n'
                  '        for (Entity station : marketStations) {\n'
                  '            FactionComponent stationFaction = fm.get(station);\n'
                  '            if (ppm.has(station)\n'
                  '                    && stationFaction != null\n'
                  '                    && stationFaction.factionId == fleetFaction.factionId) {\n'
                  '                procurementMarkets.add(station);\n'
                  '            }\n'
                  '        }\n'
                  '        if (procurementMarkets.isEmpty()) {\n'
                  '            return false;\n'
                  '        }\n'
                  '        MarketDirectory procurementDirectory = new MarketDirectory(contentCatalog);\n'
                  '        procurementDirectory.rebuild(procurementMarkets);\n'
                  '        ai.resetRoute();\n'
                  '        return applySaleRoute(\n'
                  '                ai, routePlanner.findBestExistingCargoSale(profile, procurementDirectory).orElse(null));\n'
                  '    }\n\n'
                  '    private boolean findSellRoute(TradeAIComponent ai, FleetTradeProfile profile) {\n'
                  '        ai.resetRoute();\n'
                  '        return applySaleRoute(\n'
                  '                ai, routePlanner.findBestExistingCargoSale(profile, marketDirectory).orElse(null));\n'
                  '    }\n\n'
                  '    private boolean applySaleRoute(TradeAIComponent ai, TradeSaleRoute route) {\n'
                  '        if (route == null) {\n'
                  '            return false;\n'
                  '        }\n\n'
                  '        ai.buyStationId = null;\n'
                  '        ai.sellStationId = route.sellStationId();\n'
                  '        ai.targetStationId = route.sellStationId();\n'
                  '        ai.targetItem = route.itemId();\n'
                  '        ai.targetAmount = route.amount();\n'
                  '        ai.expectedProfitMilliCredits = route.saleRevenueMilliCredits();\n'
                  '        ai.routeSearchCooldown = 0f;\n'
                  '        ai.state = TradeAIComponent.State.TRAVEL_TO_SELL;\n'
                  '        return true;\n'
                  '    }'
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('TradeAISystem patch marker mismatch: ' + old[:100])
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/stage9e-procurement-patch.yml').unlink()
          PY
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add src/main/java/com/spacesim/systems/TradeAISystem.java .github/workflows/stage9e-procurement-patch.yml
          git commit -m "feat: prioritize same-faction construction procurement"
          git push origin HEAD:agent/stage9e-readywork3
