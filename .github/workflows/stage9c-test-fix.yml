name: Stage 9C test fix

on:
  push:
    branches: [agent/stage9c-destruction-shock]
    paths: ['.github/workflows/stage9c-test-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage9c-destruction-shock
          fetch-depth: 0
      - name: Fix NewsArticle assertion and remove diagnostics
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/test/java/com/spacesim/world/DestructionServiceIntegrationTest.java')
          text = p.read_text(encoding='utf-8')
          if 'news.get(0).title()' not in text:
              raise SystemExit('Expected NewsArticle assertion not found')
          p.write_text(text.replace('news.get(0).title()', 'news.get(0).headline', 1), encoding='utf-8')
          for name in ['docs/stage9c_ci_debug.txt', 'docs/stage9c_ci_debug_current.txt']:
              q = Path(name)
              if q.exists():
                  q.unlink()
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/stage9c-test-fix.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct Stage 9C news assertion"
          git push origin HEAD:agent/stage9c-destruction-shock
