name: Stage 9A final tweak

on:
  push:
    branches:
      - agent/stage9a-entity-lifecycle
    paths:
      - '.github/workflows/stage9a-final-tweak.yml'

permissions:
  contents: write

jobs:
  tweak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage9a-entity-lifecycle
          fetch-depth: 0
      - name: Add deterministic lifecycle coverage and clarify roadmap wording
        shell: python
        run: |
          from pathlib import Path

          test = Path('src/test/java/com/spacesim/simulation/EntityLifecycleServiceTest.java')
          text = test.read_text(encoding='utf-8')
          marker = '''    @Test\n    void removeОтклоняетEntityСДеньгамиИлиТоваромНеМеняяRegistry() {'''
          addition = '''    @Test\n    void одинаковаяLifecycleПоследовательностьДаётОдинаковыйSnapshot() {\n        SimulationSession first = SimulationSession.createDemo(ROOT_SEED);\n        SimulationSession second = SimulationSession.createDemo(ROOT_SEED);\n\n        for (int index = 0; index < 4; index++) {\n            EntityId firstId = first.createEntity(\n                    emptyPersistentCandidate("Deterministic " + index, index * 10f, index * 20f));\n            EntityId secondId = second.createEntity(\n                    emptyPersistentCandidate("Deterministic " + index, index * 10f, index * 20f));\n            assertEquals(firstId, secondId);\n            if ((index & 1) == 0) {\n                assertTrue(first.removeEntity(firstId));\n                assertTrue(second.removeEntity(secondId));\n            }\n        }\n\n        assertEquals(first.snapshot(), second.snapshot());\n    }\n\n'''
          if marker not in text:
              raise SystemExit('Test insertion marker not found')
          text = text.replace(marker, addition + marker, 1)
          test.write_text(text, encoding='utf-8')

          roadmap = Path('docs/development_roadmap.md')
          text = roadmap.read_text(encoding='utf-8')
          text = text.replace(
              '- [x] определить authoritative lifecycle persistent local entities: create/register/disable/destroy/unregister;',
              '- [x] определить authoritative lifecycle persistent local entities: create/register/structural disable-for-removal/unregister; экономическое destroy непустых assets остаётся Stage 9C;',
              1)
          text = text.replace(
              '- [x] dangling persistent references не переживают destroy;',
              '- [x] dangling persistent references не переживают structural removal;',
              1)
          text = text.replace(
              '- [x] save/load корректно сохраняет мир после create/destroy;',
              '- [x] save/load корректно сохраняет мир после runtime create/structural removal;',
              1)
          text = text.replace(
              '- уничтоженный объект отсутствует после world save/load.',
              '- structurally removed объект отсутствует после world save/load; non-empty destruction проверяется Stage 9C.',
              1)
          roadmap.write_text(text, encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/stage9a-final-tweak.yml
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git add src/test/java/com/spacesim/simulation/EntityLifecycleServiceTest.java docs/development_roadmap.md .github/workflows/stage9a-final-tweak.yml
          git commit -m "test: finalize Stage 9A lifecycle coverage"
          git push origin HEAD:agent/stage9a-entity-lifecycle
