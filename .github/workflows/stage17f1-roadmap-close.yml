name: Stage 17F.1 roadmap closure

on:
  push:
    branches:
      - agent/stage17f-doctrine-profile
    paths:
      - .github/workflows/stage17f1-roadmap-close.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17f-doctrine-profile
          fetch-depth: 0
      - name: Apply roadmap closure
        run: python3 scripts/stage17f1_roadmap_close.py
      - name: Commit roadmap closure and remove applicator
        run: |
          git rm .github/workflows/stage17f1-roadmap-close.yml scripts/stage17f1_roadmap_close.py
          git add docs/development_roadmap.md
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git commit -m "Mark Stage 17F.1 complete and advance to fiscal policy"
          git push origin HEAD:agent/stage17f-doctrine-profile
