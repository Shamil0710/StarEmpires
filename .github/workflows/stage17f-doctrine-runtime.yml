name: Stage 17F doctrine runtime

on:
  push:
    branches:
      - agent/stage17f-doctrine-profile
    paths:
      - .github/workflows/stage17f-doctrine-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage17f-doctrine-profile
          fetch-depth: 0
      - name: Apply shared doctrine boundary
        run: python3 scripts/stage17f_doctrine_runtime.py
      - name: Commit runtime boundary
        run: |
          git rm .github/workflows/stage17f-doctrine-runtime.yml scripts/stage17f_doctrine_runtime.py
          git add src/main/java/com/spacesim/world/TerritorialControlRuntime.java
          git add src/main/java/com/spacesim/world/WorldSimulation.java
          git config user.name "Shamil0710"
          git config user.email "69683579+Shamil0710@users.noreply.github.com"
          git commit -m "Stage 17F.1: add shared doctrine update boundary"
          git push origin HEAD:agent/stage17f-doctrine-profile
